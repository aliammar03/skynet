# Codex project orchestration config. Permission defaults are owned by Home Manager: the unprivileged
# aliammar Unix account is the filesystem/OS construction boundary, with no project sandbox override.
# Production authority remains governed by docs/system-design.md, credentials, and hard exec-policy
# blocks. The six worker definitions live in .codex/agents/*.toml.

# Concurrency is NOT capped here. Fan-out is bounded by platform capacity and task judgement, with only
# the semantic limits in the doctrine (one persistent Companion, at most one Senior Executor,
# non-overlapping mutable ownership, no worker-spawns-worker). Codex's own
# max_concurrent_threads_per_session default applies; do not pin a workflow-owned number as doctrine.
#
# Review lifecycle: implementation/fix publishes one authored PR and stops. Ali manually starts a
# separate fresh reviewer for that open PR. The reviewer resolves and rechecks target/base SHA + PR
# head SHA immediately before verdict. ACCEPT records that exact pair and posts a machine-readable
# acceptance marker to the PR conversation; Ali never copies or compares hashes. Ali then tells the
# original implementation/fix session only that the PR was accepted. That session validates the marker
# itself and performs bounded closeout on the SAME PR before merge. Post-ACCEPT Git changes are allowed
# only for directive/archive/planning state, Main-owned deployment-state agent_docs, append-only journal
# evidence, and generator-owned closure views. Any source/runtime/config/test/invariant/doctrine/runbook/
# behavioral-doc/stable-memory or other substantive change invalidates ACCEPT and requires fresh review.
# The sanctioned closeout commit moves the head by design and is not itself stale; Main proves the
# accepted-head..final-head delta is closeout-only and rechecks the reviewed base. Then Ali human-merges
# that same PR once. No closeout-only PR is created.
#
# Private GitHub Free still leaves a non-atomic race window between the last agent recheck and Ali's
# later click-to-merge. Prompt merge minimizes but does not remove it. Do not require a paid GitHub
# feature, manual SHA handling, or a helper that falsely claims atomic read/check+merge behavior.
