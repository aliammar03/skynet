name: skynet-drill

# skynet-drill — a throwaway service for rollback drills of `skynet deploy`. Serves nothing.
# Removed by PR once the drill ends.

x-arcane:
  tags:
    - name: drill
      color: grey

services:
  drill:
    image: busybox@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
    command: ["sh", "-c", "cat /etc/drill/note.txt; exec sleep 2147483647"]
    env_file:
      - .env
    volumes:
      - ./note.txt:/etc/drill/note.txt:ro
    healthcheck:
      test: ["CMD", "false"]
      interval: 5s
      timeout: 3s
      retries: 2
      start_period: 3s
    restart: unless-stopped
