name: skynet-drill

# skynet-drill — a throwaway service for the SKY-025 Phase 14 live drill (outage alert, revert
# auto-merge, retirement). Serves nothing. Removed by PR once the drill ends.

x-arcane:
  tags:
    - name: drill
      color: grey

services:
  drill:
    image: busybox@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
    command: ["sh", "-c", "cat /etc/drill/note.txt; exec sleep 2147483647"]
    env_file:
      - .env
    volumes:
      - ./note.txt:/etc/drill/note.txt:ro
      - drill-data:/data
    healthcheck:
      test: ["CMD", "true"]
      interval: 5s
      timeout: 3s
      retries: 2
      start_period: 3s
    restart: unless-stopped

volumes:
  drill-data:
    labels:
      skynet.service: skynet-drill
      skynet.backup: ephemeral
      skynet.managed: gitops
