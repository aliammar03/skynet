# CouchDB config for Obsidian Self-hosted LiveSync — CORS + tuning, reviewed once.
# This is the piece that historically made self-hosting LiveSync painful; here it is
# git-tracked and reproducible. Admin credentials come from COUCHDB_USER /
# COUCHDB_PASSWORD (env, materialised from .env.git + .env.sops), NOT from this file.
# Values verified live against couchdb:3.5.0 (SKY-013 Phase 1).

[couchdb]
single_node = true
max_document_size = 50000000

[chttpd]
require_valid_user = true
# keep /_up open for the healthcheck / load-balancer probes while everything else 401s
require_valid_user_except_for_up = true
enable_cors = true
# LiveSync ships large chunked bodies; raise the request ceiling to ~4 GiB
max_http_request_size = 4294967296

[chttpd_auth]
require_valid_user = true

[httpd]
enable_cors = true
WWW-Authenticate = Basic realm="couchdb"

[cors]
origins = app://obsidian.md,capacitor://localhost,http://localhost
credentials = true
headers = accept, authorization, content-type, origin, referer
methods = GET, PUT, POST, HEAD, DELETE
max_age = 3600
