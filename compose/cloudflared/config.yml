# cloudflared ingress — the tunnel's routing table, in reviewed git; mounted ro (locally-managed).
# A hostname is public only with BOTH a rule here AND a public DNS CNAME → <id>.cfargotunnel.com.
# See docs/design/identity-and-proxy.md.
tunnel: b5171e13-f6c4-409c-8b60-760f769c706b
credentials-file: /etc/cloudflared/credentials.json

# First match wins; list MUST end with the catch-all.
ingress:
  # Pilot (SKY-014 P2): obsidian self-gates (CouchDB 401) + client-side E2E, so own-auth is enough.
  - hostname: obsidian.aliammar.net
    service: https://10.10.100.35
    originRequest:
      originServerName: obsidian.aliammar.net   # SNI → Caddy serves the right LE cert, not the IP
  # karakeep — own-auth (its own login); reuses the internal Caddy vhost (→ 10.10.100.75:3000).
  - hostname: karakeep.aliammar.net
    service: https://10.10.100.35
    originRequest:
      originServerName: karakeep.aliammar.net
  # calibre — NO native login; gated by Authentik forward-auth (SKY-003 P3). Public exposure only
  # works alongside auth.aliammar.net below: an unauthenticated request is 302'd to Authentik, so
  # the login host must resolve publicly too, or the redirect dead-ends.
  - hostname: calibre.aliammar.net
    service: https://10.10.100.35
    originRequest:
      originServerName: calibre.aliammar.net
  # auth — Authentik's login/OIDC/flow endpoints, published so the forward-auth redirect above
  # resolves for EXTERNAL users. The apps-Caddy vhost refuses Authentik's admin UI (/if/admin/*)
  # when the request arrives via this tunnel (source .33), so the admin surface stays internal-only.
  - hostname: auth.aliammar.net
    service: https://10.10.100.35
    originRequest:
      originServerName: auth.aliammar.net
  # aiostreams — own-auth (local login + OIDC, AIOSTREAMS_AUTH_REQUIRED=true); reuses the internal
  # Caddy vhost (→ 10.10.100.65:3000). OIDC issuer is auth.aliammar.net (public above), so the
  # external login redirect resolves.
  - hostname: aiostreams.aliammar.net
    service: https://10.10.100.35
    originRequest:
      originServerName: aiostreams.aliammar.net
  # aiometadata — own-auth (sign-in required + OIDC, AUTH_REQUIRE_SIGNIN=true); reuses the internal
  # Caddy vhost (→ 10.10.100.66:3232). Same public OIDC issuer as aiostreams.
  - hostname: aiometadata.aliammar.net
    service: https://10.10.100.35
    originRequest:
      originServerName: aiometadata.aliammar.net
  - service: http_status:404
