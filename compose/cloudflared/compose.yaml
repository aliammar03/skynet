name: cloudflared

# cloudflared — Skynet-managed Cloudflare Tunnel connector (SKY-014).
#
# WHAT A TUNNEL IS: cloudflared dials OUT to Cloudflare's edge (443 + 7844) and holds the
# connection open; Cloudflare then delivers requests for our public hostnames back down that
# same outbound link. Nothing listens for inbound connections here — there is NO OPNsense
# inbound rule, and there never will be. That outbound-only shape is the whole security point.
#
# ORIGIN = the apps Caddy, not per-service. The tunnel forwards everything to a SINGLE origin,
# https://10.10.100.35 (compose/caddy-apps), which already terminates the real Let's Encrypt
# cert and routes by hostname to the backend. So TLS stays end-to-end (edge → cloudflared →
# Caddy → service) and publishing a new app publicly = add ONE ingress line in config.yml +
# ONE public DNS record — reusing the internal Caddy route verbatim.
#
# LOCALLY-MANAGED, so the ingress rules live in reviewed git (config.yml), not the Cloudflare
# dashboard. This is deliberate: a token-run tunnel is *remotely*-managed and IGNORES a local
# config.yml (cloudflared #1029) — which would put our routing table back in a dashboard
# snowflake, the exact thing this service exists to erase. Locally-managed needs a
# credentials.json file (the tunnel secret) instead of a token — see the volumes note below.
#
# IP: this connector reuses CT 1033's DMZ address 10.10.100.33, so it inherits the existing
# egress (OPNsense rule 800: HOST_CLOUDFLARED .33 → 443,7844) with no firewall change. One IP
# can't be in two places, so bring-up IS the cutover (Phase 2): the container can only bind .33
# after CT 1033 is stopped. Rollback = `docker compose down` + `pct start 1033`.
#
# See planning/projects/SKY-014-*.md and docs/design/identity-and-proxy.md (the public path).

x-arcane:
  tags:
    - name: tunnel
      color: gray

services:
  cloudflared:
    image: cloudflare/cloudflared:2026.8.2@sha256:0aa26e284f05e6c77ae375b8c9c11d9eb6a448fb7bcd8d40f31cb6176189eb38
    hostname: cloudflared
    # Locally-managed run: --config points at the git-tracked ingress; --no-autoupdate because
    # the image is digest-pinned (Renovate bumps it by PR, not a self-update at runtime).
    command: ["tunnel", "--no-autoupdate", "--config", "/etc/cloudflared/config.yml", "run"]
    env_file:
      - .env                 # TUNNEL_METRICS (materialised from .env.git) — read by run AND the healthcheck
    restart: unless-stopped
    volumes:
      # The routing table, in git: Arcane GitOps syncs this dir, so the ro-mount carries
      # config.yml to the container. Publish/route a host = edit here → PR → deploy.
      - ./config.yml:/etc/cloudflared/config.yml:ro
      # The tunnel credential (AccountTag/TunnelID/TunnelSecret). It is a SECRET, so it never
      # lives plaintext in git — sops-encrypted at compose/cloudflared/credentials.json.sops
      # (source of truth), materialised 0600 on the host and bind-mounted read-only here. The
      # image is distroless (no shell), so the file is delivered by mount, not reconstructed
      # in-container. Placed at the Cloudflare checkpoint; see the service README.
      - /opt/docker/appdata/cloudflared/creds/credentials.json:/etc/cloudflared/credentials.json:ro
    networks:
      # Reuses CT 1033's DMZ static IP — inherits OPNsense rule 800 egress (no firewall change).
      dmz:
        ipv4_address: 10.10.100.33
    dns:
      - 10.10.20.30          # Technitium (forwards public names so the edge endpoints resolve)
    healthcheck:
      # Distroless image → no shell, no curl, no bash /dev/tcp. cloudflared's OWN `tunnel ready`
      # subcommand runs in exec form (no shell needed) and queries the metrics /ready endpoint
      # (TUNNEL_METRICS, from .env), exiting 0 only once the tunnel has ≥1 live edge connection.
      test: ["CMD", "cloudflared", "tunnel", "ready"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

networks:
  dmz:
    external: true
    name: dmz
