name: cloudflared

# Skynet-managed Cloudflare Tunnel connector (SKY-014). Outbound-only; forwards every public
# hostname to the apps Caddy (https://10.10.100.35). Ingress lives in config.yml. Why locally-managed
# (not token), credential bootstrap, distroless notes: compose/cloudflared/README.md.
x-arcane:
  tags:
    - name: tunnel
      color: gray

services:
  cloudflared:
    image: cloudflare/cloudflared:2026.8.2@sha256:0aa26e284f05e6c77ae375b8c9c11d9eb6a448fb7bcd8d40f31cb6176189eb38
    hostname: cloudflared
    command: ["tunnel", "--no-autoupdate", "--config", "/etc/cloudflared/config.yml", "run"]
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./config.yml:/etc/cloudflared/config.yml:ro
      # sops-sealed credentials.json.sops → materialised 0600 on host → mounted ro (distroless: no shell).
      - /opt/docker/appdata/cloudflared/creds/credentials.json:/etc/cloudflared/credentials.json:ro
    networks:
      # Reuses CT 1033's .33 → inherits OPNsense rule 800 egress (no firewall change).
      dmz:
        ipv4_address: 10.10.100.33
    dns:
      # Public upstreams: only resolves Cloudflare's edge SRV, which Technitium returns empty for.
      - 1.1.1.1
      - 8.8.8.8
    healthcheck:
      # distroless → no shell; cloudflared's own subcommand polls the metrics /ready endpoint.
      test: ["CMD", "cloudflared", "tunnel", "ready"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

networks:
  dmz:
    external: true
    name: dmz
