name: karakeep

x-arcane:
  tags:
    - name: bookmarks
      color: orange

services:
  web:
    image: ghcr.io/karakeep-app/karakeep:release@sha256:b069e4307dec06ea06d16989c6861c30a1ff208568be44ed5fb5d422cd3e950c
    restart: unless-stopped
    volumes:
      - /opt/docker/appdata/karakeep/data:/data
    env_file:
      - .env
    environment:
      MEILI_ADDR: http://meilisearch:7700
      BROWSER_WEB_URL: http://chrome:9222
      DATA_DIR: /data
    networks:
      backend:
      dmz:
        ipv4_address: 10.10.100.75
    depends_on:
      chrome:
        condition: service_healthy
      meilisearch:
        condition: service_healthy

  chrome:
    image: zenika/alpine-chrome:124@sha256:20cddfa693fe823aa45c93739ed3b4f500dcb81c559d71fd67e2a5a786ac24be
    restart: unless-stopped
    command:
      - --no-sandbox
      - --disable-gpu
      - --disable-dev-shm-usage
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9222
      - --hide-scrollbars
      - --disable-blink-features=AutomationControlled
      - --window-size=1440,900
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9222/json/version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  meilisearch:
    image: getmeili/meilisearch:v1.41.0@sha256:860fa4baed04ae1c235de870edab0c8006227546dea1bbb6411fbfc5e27cf1db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data:/meili_data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:7700/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  backend:
  dmz:
    external: true
    name: dmz

volumes:
  # meilisearch = standalone DB engine; index is re-indexable from the app's SQLite data
  meili_data:
    labels:
      skynet.service: karakeep
      skynet.backup: ephemeral
      skynet.managed: gitops
