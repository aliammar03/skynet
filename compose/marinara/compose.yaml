# Marinara Engine — the skynet way: structural only; all config/secrets in .env
# (.env.git non-secret + .env.sops secrets, materialised by scripts/gitops-deploy.sh).
x-arcane:
  tags:
    - name: ai
      color: blue

services:
  marinara:
    image: ghcr.io/pasta-devs/marinara-engine:latest@sha256:de94abe62bc6f3c94f7d537893062fff4de042f636cbe703ce51d333ae677791
    init: true
    env_file:
      - .env
    volumes:
      - /opt/docker/appdata/marinara/data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:7860/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      dmz:
        ipv4_address: 10.10.100.85

networks:
  dmz:
    external: true
    name: dmz
