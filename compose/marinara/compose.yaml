# Marinara Engine — the skynet way: structural only; all config/secrets in .env
# (.env.git non-secret + .env.sops secrets, materialised by scripts/gitops-deploy.sh).
x-arcane:
  tags:
    - name: ai
      color: blue

services:
  marinara:
    image: ghcr.io/pasta-devs/marinara-engine:latest@sha256:eed2d2f7db49d5867f30f90d314c2f668f767246cd6e7a48907c3386720be0db
    init: true
    env_file:
      - .env
    volumes:
      - /opt/docker/appdata/marinara/data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:7860/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      dmz:
        ipv4_address: 10.10.100.85

networks:
  dmz:
    external: true
    name: dmz
