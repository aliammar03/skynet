# SillyTavern — the skynet way: pinned image, config in .env, absolute backup-friendly volumes.
services:
  sillytavern:
    image: ghcr.io/sillytavern/sillytavern:latest@sha256:5bb7ef334602ad72b29351acae4d9744ce16c99a1fab840acbd42a7d49d27d9b
    hostname: sillytavern
    env_file:
      - .env
    volumes:
      - /opt/docker/appdata/silly/config:/home/node/app/config
      - /opt/docker/appdata/silly/data:/home/node/app/data
      - /opt/docker/appdata/silly/plugins:/home/node/app/plugins
      - /opt/docker/appdata/silly/extensions:/home/node/app/public/scripts/extensions/third-party
    healthcheck:
      test: ["CMD", "node", "src/healthcheck.js"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    dns:
      - 10.10.20.30
    networks:
      dmz:
        ipv4_address: 10.10.100.69

networks:
  dmz:
    external: true
    name: dmz
