# The apps' login portal (login.aliammar.net) and forward-auth for caddy-apps: `import authelia` in a
# site there asks this instance, never the admin one. Reachable from the internet via the tunnel.
services:
  authelia:
    container_name: authelia
    image: ghcr.io/authelia/authelia:4.39.28@sha256:bd97cff4fcbf715b5ff1f9ae286afbe6033afce385302520b0368122d43a6f54
    restart: unless-stopped
    env_file: secret.sops.env # session, storage and JWT secrets (AUTHELIA_* variables)
    environment:
      TZ: Asia/Karachi
      # Merged in order: the settings, the OIDC clients (digests only), the OIDC provider's keys. In
      # /etc/authelia, not /config: as root the image chowns /config at start, and these are read-only.
      X_AUTHELIA_CONFIG: /etc/authelia/configuration.yml,/etc/authelia/oidc-clients.yml,/etc/authelia/oidc.yml
    mem_limit: 256m
    volumes:
      - ./configuration.yml:/etc/authelia/configuration.yml:ro
      - ./oidc-clients.yml:/etc/authelia/oidc-clients.yml:ro
      - ./oidc.sops.yml:/etc/authelia/oidc.yml:ro # decrypted by doco-cd
      - ./users.sops.yml:/etc/authelia/users.yml:ro
      - /opt/appdata/authelia:/data # sqlite (passkeys, TOTP, consent), notification.txt
    networks: [edge, backend]
    depends_on:
      redis:
        condition: service_healthy
    # The image's own healthcheck (/app/healthcheck.sh) applies.
  # Its sessions (encrypted with the session secret), so they outlive a restart of Authelia.
  redis:
    container_name: authelia-redis
    image: docker.io/library/redis:8.10.3-alpine@sha256:896f241f438ab6a210cfb24f573b84bea721a4cbe67f1b4fd07eb638b3b02a7b
    restart: unless-stopped
    # Saved to disk each minute something changed, and when it stops: a reboot keeps them too.
    command: [redis-server, --save, "60 1", --appendonly, "no"]
    mem_limit: 64m # measured 2026-10-29: 6 MiB holding a session
    volumes:
      - /opt/appdata/authelia/redis:/data # sessions (backup class: cache)
    networks: [backend]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
networks:
  edge:
    external: true
  # This stack's own; Redis needs no internet.
  backend:
    internal: true
