; CouchDB config for Obsidian Self-hosted LiveSync: CORS and limits, as in v1.
; The admin login comes from COUCHDB_USER (compose) and COUCHDB_PASSWORD (secret.sops.env), not
; from this file.

[couchdb]
single_node = true
max_document_size = 50000000

[log]
; Warnings and up: at info every request, the healthcheck's included, is a line.
level = warning

[chttpd]
require_valid_user = true
; /_up stays open for the healthcheck and Gatus; everything else needs the login.
require_valid_user_except_for_up = true
enable_cors = true
; LiveSync sends large chunked bodies: allow requests up to ~4 GiB.
max_http_request_size = 4294967296

[chttpd_auth]
require_valid_user = true

[httpd]
enable_cors = true
WWW-Authenticate = Basic realm="couchdb"

[cors]
origins = app://obsidian.md,capacitor://localhost,http://localhost
credentials = true
headers = accept, authorization, content-type, origin, referer
methods = GET, PUT, POST, HEAD, DELETE
max_age = 3600
