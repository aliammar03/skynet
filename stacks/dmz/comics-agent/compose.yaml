# The comics agent (skynetv2.md → P8, D17): Codex on Ali's ChatGPT subscription, in Discord's
# #comics through OpenAB, runs comics and manga day to day with its `comics` skill. It holds no key:
# comics-tools, beside it, holds them and offers it a fixed list of verbs over CLU, SABnzbd, Komga and
# Uchiyomi. No door: nothing reaches the stack from outside.
x-discord: &discord
  COMICS_CHANNEL: "1567143468554256395" # #comics
  COMICS_DESK: "1567143806191804476" # the desk: Ali's standing thread in #comics
  COMICS_ALI: "1351159625533362258" # Ali, the one person it answers and whose ✅ counts
  COMICS_ROLE: "1567143228409647185" # the bot's own role, which Discord's @ list offers beside it
services:
  comics-agent:
    container_name: comics-agent
    # A nightly (OpenAB 0.10.0 and two commits): its ACP adapter, 2.5, runs Codex 0.165, whose model
    # list has gpt-6.1-terra. 0.10.0's adapter, 2.0, runs its own Codex 0.158, whose list doesn't.
    image: ghcr.io/openabdev/openab:nightly-20261103-41653922154.1-codex@sha256:52b5afb9b369dbc92e72b7e713e05f2cdf3f135c73367a17ce8b91dc2dc8ff16
    restart: unless-stopped
    env_file: secret.sops.env # DISCORD_BOT_TOKEN
    environment:
      <<: *discord
      TZ: Asia/Karachi
    # 180–270 MB with one session (the exit test, 2026-11-03); the pool holds two (config.toml).
    mem_limit: 1g
    volumes:
      - ./config.toml:/etc/openab/config.toml:ro
      # Its home: Codex's login and sessions (.codex), OpenAB's thread map (.openab); owner 1000, the
      # image's user (hosts/docker-dmz). Its instructions and skill come from git, read-only.
      - /opt/appdata/comics-agent/home:/home/node
      - ./agent/AGENTS.md:/home/node/AGENTS.md:ro
      - ./agent/skills/comics:/home/node/.agents/skills/comics:ro
      # Codex's own settings (web search), as its system config: outside its home, so nothing there
      # is created or shadowed.
      - ./agent/codex.toml:/etc/codex/config.toml:ro
    networks:
      # OpenAI and Discord.
      egress: {}
      # comics-tools, its only way to the apps.
      backend: {}
    # The image's healthcheck applies: the openab process.

  comics-tools:
    container_name: comics-tools
    image: docker.io/library/python:3.15.2-alpine3.24@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd
    restart: unless-stopped
    command: [python3, -I, /tools/comics_tools.py]
    # The bot's token (to read Ali's ✅ back from Discord) and the apps' keys; never the agent's.
    env_file: [secret.sops.env, tools.sops.env]
    environment:
      <<: *discord
      TZ: Asia/Karachi
    # Unraid's nobody:users, who owns CLU's library and downloads, and SABnzbd's settings.
    user: "99:100"
    mem_limit: 128m
    volumes:
      - ./tools:/tools:ro
      # SABnzbd's API key, from its own settings.
      - /opt/appdata/clu/sabnzbd/sabnzbd.ini:/sabnzbd/sabnzbd.ini:ro
      # CLU's library and downloads, at CLU's own paths, and the manga, for inspect.
      - { type: bind, source: /mnt/storage/Books/Comics/clu, target: /data, read_only: true, bind: { create_host_path: false } }
      - /var/cache/clu/downloads:/downloads:ro
      - { type: bind, source: /mnt/storage/Books/Manga, target: /manga, read_only: true, bind: { create_host_path: false } }
    networks:
      # The agent calls it here.
      backend: {}
      # CLU and SABnzbd, by name (D17's exception to Networks: CLU's port has no login).
      clu_backend: {}
      # Komga and Uchiyomi through caddy-apps (its edge aliases), and Discord.
      edge: {}
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
networks:
  egress: {}
  backend:
    internal: true
  clu_backend:
    external: true
  edge:
    external: true
