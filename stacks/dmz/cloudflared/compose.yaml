# The tunnel connector: outbound-only to Cloudflare, so the public names reach caddy-apps with no
# open port. Tunnel `skynet` is locally managed: its routes are config.yml, reviewed in PRs.
services:
  cloudflared:
    container_name: cloudflared
    image: docker.io/cloudflare/cloudflared:2026.10.3@sha256:faa8e0a1475f137c910be6025f43c8e4092fdd35461b31e19fd1390657a1ff39
    # The image's entrypoint is `cloudflared --no-autoupdate`: updates come as Renovate PRs.
    command: [tunnel, --config, /etc/cloudflared/config.yml, --metrics, 127.0.0.1:2000, run]
    restart: unless-stopped
    # TUNNEL_TOKEN. An environment variable, not a credentials file: doco-cd writes decrypted files
    # root-only, and this runs as the image's own non-root user.
    env_file: secret.sops.env
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    volumes:
      - ./config.yml:/etc/cloudflared/config.yml:ro
    networks:
      # Only the macvlan: egress as HOST_CLOUDFLARED (rule 800), and caddy-apps (.35) by name. Not on
      # `edge`, so it reaches no app directly.
      dmz:
        ipv4_address: 10.10.100.33
    healthcheck:
      # Distroless (no shell): cloudflared asks its own metrics server whether it holds a connection
      # to Cloudflare. The address must match the run command's.
      test: [CMD, cloudflared, tunnel, --metrics, 127.0.0.1:2000, ready]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
networks:
  dmz:
    external: true
