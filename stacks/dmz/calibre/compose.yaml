# Calibre (calibre.aliammar.net): the e-book library's desktop app, in the browser. No login of its
# own: the apps' Authelia guards it (admins), inside and through the tunnel. Not on `edge`: caddy-apps
# is the only container that reaches it.
services:
  calibre:
    container_name: calibre
    # linuxserver's build tags; Renovate reads them through a versioning rule (renovate.json).
    image: lscr.io/linuxserver/calibre:v9.17.0-ls429@sha256:1223ffddba4ae6faedbd029bcfaa27c43eeb6d172e34c7fac5e0fd5bbad27bf3
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Asia/Karachi
      UMASK: "022"
      TITLE: Calibre Admin
      DISABLE_IPV6: "true"
    shm_size: 1gb # the browser desktop (selkies) needs more than Docker's default 64 MB
    stop_grace_period: 1m # Calibre writes its database on exit
    mem_limit: 2g
    volumes:
      - /opt/appdata/calibre/config:/config # the library, Calibre's settings, the desktop's home
    networks:
      # Shared with caddy-apps alone (internal, from the host's Nix config): the desktop (8080, 8181),
      # its stream (8082) and Calibre's content server (8081) all answer without a login.
      door-calibre: {}
      # Its own way out (metadata, covers); nothing else is on it.
      egress: {}
    healthcheck:
      # The desktop's web server; the image sets CUSTOM_PORT=8080 (its EXPOSE says 3000, wrongly).
      test: [CMD, curl, -fsS, -o, /dev/null, http://localhost:8080/]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
networks:
  door-calibre:
    external: true
  egress: {}
