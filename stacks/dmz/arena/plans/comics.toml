# The comics agent's models (D17, D18; Ali, 2026-11-04): the qualifier runs each model at high (Terra's
# effort in #comics), then the ladder runs the two best at the other efforts. The Skynet agent starts
# each stage on each lane (engine/arena.py): Codex once it's logged in, Claude once its week resets.
suite = "comics"

# Percent of each plan's windows. A lane waits while its 5-hour window is above `five_hour`, and once
# the arena has used `week` of a week, until that week resets. 90 and 30, not 60 and 20 (Ali,
# 2026-11-04: "time is money"): the rest is the comics agent's and the Skynet agent's.
[caps]
five_hour = 90
week = 30

# ChatGPT Plus. Not gpt-6-astra (Ali, 2026-11-04): 100 on its first rounds, like Terra, but about 14%
# of the 5-hour window a run against Terra's 1%. Its runs so far stay in the results.
[lanes.codex]
models = ["gpt-6.1-terra", "gpt-6.1-sol", "gpt-6-luna"]

# Claude Pro, the Skynet agent's own plan: its week was past half on 11-04; it resets 11-10 08:00.
[lanes.claude]
models = ["claude-haiku-5-5", "claude-sonnet-5-5", "claude-opus-5-5"]

[[stages]]
name = "qualifier"
effort = "high"

[[stages]]
name = "ladder"
top = 2
close = 5 # within 5 points of the cut: those run the qualifier once more first
efforts = ["low", "medium", "xhigh"]
