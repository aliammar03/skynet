# SillyTavern (sillytavern.aliammar.net): the AI chat front end. No login of its own: the apps'
# Authelia guards it (admins); inside only. Only on the macvlan, at v1's .69: rule 340 lets it reach
# ComfyUI on the workstation, and it admits only caddy-apps (.35).
services:
  sillytavern:
    container_name: sillytavern
    # v1's build: v1 pinned the moving `release` tag at this digest, which no version tag carries.
    image: ghcr.io/sillytavern/sillytavern:release@sha256:b712eb8609f2d9b9f820b581fecfc7cd400c50a6c6533287cbbd368c4fb1d060
    restart: unless-stopped
    environment:
      NODE_ENV: production
      FORCE_COLOR: "1"
      SILLYTAVERN_HEARTBEATINTERVAL: "30"
      # Its own second gate: the connection must come from caddy-apps (or its own healthcheck), so
      # its macvlan neighbours get 403. The connecting address, not X-Forwarded-For, which would have
      # to list every client (these override config.yaml). It refuses to start with no gate at all.
      SILLYTAVERN_WHITELIST: '["::1","127.0.0.1","10.10.100.35"]'
      SILLYTAVERN_ENABLEFORWARDEDWHITELIST: "false"
      SILLYTAVERN_WHITELISTDOCKERHOSTS: "false" # no Docker host to trust (its names don't resolve here)
    mem_limit: 1g
    volumes:
      - /opt/appdata/sillytavern/config:/home/node/app/config
      - /opt/appdata/sillytavern/data:/home/node/app/data
      - /opt/appdata/sillytavern/plugins:/home/node/app/plugins
      - /opt/appdata/sillytavern/extensions:/home/node/app/public/scripts/extensions/third-party
    # Only the macvlan: it leaves as .69, and caddy-apps reaches it there. Not on `edge`, so no app
    # reaches it.
    networks:
      dmz:
        ipv4_address: 10.10.100.69 # in ROLE_DMZ_AI_CLIENTS (rule 340: ComfyUI on the workstation)
    healthcheck:
      test: [CMD, node, src/healthcheck.js]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
networks:
  dmz:
    external: true
