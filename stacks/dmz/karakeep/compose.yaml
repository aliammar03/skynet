# Karakeep (karakeep.aliammar.net): bookmarks, with full-page archives, OCR and AI tags. Its own login;
# public through the tunnel. Its browser and its search sit on this stack's own networks, out of
# `edge`'s reach, and out of each other's.
services:
  karakeep:
    container_name: karakeep
    # It migrates its database on upgrade, one way (README).
    image: ghcr.io/karakeep-app/karakeep:0.34.1@sha256:69ae5315c618b7c14c1af3e34c6e211acdb231793af424ecd1cab0b70691d987
    restart: unless-stopped
    env_file: secret.sops.env # NEXTAUTH_SECRET, MEILI_MASTER_KEY, PROMETHEUS_AUTH_TOKEN, OPENAI_API_KEY
    environment:
      TZ: Asia/Karachi
      NEXTAUTH_URL: https://karakeep.aliammar.net
      DATA_DIR: /data
      MEILI_ADDR: http://meilisearch:7700
      BROWSER_WEB_URL: http://chrome:9222
      BROWSER_CONNECT_ONDEMAND: "false"
      # Public: no strangers' accounts (or OpenAI bills). Ali adds users from the admin settings.
      DISABLE_SIGNUPS: "true"
      DISABLE_PASSWORD_AUTH: "false"
      RATE_LIMITING_ENABLED: "true"
      DISABLE_NEW_RELEASE_CHECK: "false"
      # AI tagging and summaries (OpenAI). Text: karakeep 0.34's default, which it says costs half what
      # gpt-5.6-luna does (v1 used gpt-5.6-terra). Images: v1's model; karakeep's default there is
      # still gpt-4o-mini.
      INFERENCE_TEXT_MODEL: gpt-6-luna
      INFERENCE_IMAGE_MODEL: gpt-5.6-luna
      INFERENCE_USE_MAX_COMPLETION_TOKENS: "true"
      INFERENCE_OUTPUT_SCHEMA: structured
      OPENAI_REASONING_EFFORT: low
      OPENAI_SERVICE_TIER: default
      INFERENCE_CONTEXT_LENGTH: "16384"
      INFERENCE_MAX_OUTPUT_TOKENS: "4096"
      INFERENCE_LANG: english
      INFERENCE_NUM_WORKERS: "2"
      INFERENCE_JOB_TIMEOUT_SEC: "180"
      INFERENCE_ENABLE_AUTO_TAGGING: "true"
      INFERENCE_ENABLE_AUTO_SUMMARIZATION: "true"
      EMBEDDING_TEXT_MODEL: text-embedding-3-small
      OCR_USE_LLM: "true"
      OCR_CACHE_DIR: /data/ocr-cache
      OCR_LANGS: eng,urd
      OCR_CONFIDENCE_THRESHOLD: "45"
      # The crawler: full-page screenshots, PDFs and archives, and videos up to 1 GB.
      CRAWLER_NUM_WORKERS: "2"
      CRAWLER_DOWNLOAD_BANNER_IMAGE: "true"
      CRAWLER_STORE_SCREENSHOT: "true"
      CRAWLER_FULL_PAGE_SCREENSHOT: "true"
      CRAWLER_STORE_PDF: "true"
      CRAWLER_FULL_PAGE_ARCHIVE: "true"
      CRAWLER_FULL_PAGE_ARCHIVE_MAX_SIZE_MB: "1024" # bigger ones never render; MAX_ASSET_SIZE_MB's cap
      CRAWLER_ENABLE_ADBLOCKER: "true"
      # Bot checks flag a browser whose timezone doesn't match its IP (Pakistan).
      CRAWLER_BROWSER_TIMEZONE: Asia/Karachi
      CRAWLER_SCREENSHOT_TIMEOUT_SEC: "30"
      CRAWLER_NAVIGATE_TIMEOUT_SEC: "60"
      CRAWLER_PARSE_TIMEOUT_SEC: "120"
      CRAWLER_JOB_TIMEOUT_SEC: "300"
      CRAWLER_PARSER_MEM_LIMIT_MB: "1024"
      CRAWLER_MONOLITH_TIMEOUT_SEC: "60"
      CRAWLER_DOMAIN_RATE_LIMIT_WINDOW_MS: "1000"
      CRAWLER_DOMAIN_RATE_LIMIT_MAX_REQUESTS: "2"
      CRAWLER_VIDEO_DOWNLOAD: "true"
      CRAWLER_VIDEO_DOWNLOAD_MAX_SIZE: "1024"
      CRAWLER_VIDEO_DOWNLOAD_TIMEOUT_SEC: "1800"
      MAX_ASSET_SIZE_MB: "1024"
      DB_WAL_MODE: "true"
      SEARCH_NUM_WORKERS: "2"
      SEARCH_JOB_TIMEOUT_SEC: "120"
      ASSET_PREPROCESSING_NUM_WORKERS: "2"
      ASSET_PREPROCESSING_JOB_TIMEOUT_SEC: "300"
      RULE_ENGINE_NUM_WORKERS: "1"
      WEBHOOK_NUM_WORKERS: "1"
      WEBHOOK_TIMEOUT_SEC: "10"
      WEBHOOK_RETRY_TIMES: "5"
      LOG_LEVEL: notice
      EVENT_LOGS_ENABLED: "false"
      OTEL_TRACING_ENABLED: "false"
    # Room for the page parser (CRAWLER_PARSER_MEM_LIMIT_MB) beside the web app and its workers.
    mem_limit: 2g
    volumes:
      - /opt/appdata/karakeep/data:/data # sqlite, assets, archives, OCR cache
    networks: [edge, backend, search]
    depends_on:
      chrome:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    # The image's own healthcheck (wget /api/health) applies.

  chrome:
    container_name: karakeep-chrome
    # Karakeep's own image (Google Chrome stable). Its entrypoint adds --no-sandbox and serves
    # DevTools on 9222 (socat to Chrome's localhost port), so the command leaves both out.
    image: ghcr.io/karakeep-app/karakeep-chrome:156.0.8078.47-r1@sha256:4ad61127638dd27bfe685222787c5780dd1d083d23a7658c39af657775814c44
    restart: unless-stopped
    init: true
    command:
      - --disable-gpu
      - --disable-dev-shm-usage
      - --hide-scrollbars
      - --disable-blink-features=AutomationControlled
      - --window-size=1440,900
    mem_limit: 1g
    # Only karakeep reaches its debugging port (no login); it reaches the internet to crawl.
    networks: [backend]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9222/json/version]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  meilisearch:
    container_name: karakeep-meilisearch
    # Karakeep's own pin (its docker-compose.yml): the index's on-disk format changes between
    # versions, so it moves only with karakeep's pin.
    image: docker.io/getmeili/meilisearch:v1.41.0@sha256:860fa4baed04ae1c235de870edab0c8006227546dea1bbb6411fbfc5e27cf1db
    restart: unless-stopped
    env_file: secret.sops.env # MEILI_MASTER_KEY
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_LOG_LEVEL: WARN # at INFO every healthcheck request is a line
    mem_limit: 512m
    volumes:
      - /opt/appdata/karakeep/meili:/meili_data # the search index (rebuildable from karakeep's data)
    networks: [search]
    healthcheck:
      test: [CMD, curl, -fsS, -o, /dev/null, http://localhost:7700/health]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  edge:
    external: true
  # This stack's own. backend: karakeep and its browser; not internal, because the browser crawls
  # the web. search: karakeep and its index, with no internet, and the browser can't reach it.
  backend: {}
  search:
    internal: true
