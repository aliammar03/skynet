# Jikan: a self-hosted MyAnimeList API for aiometadata only (`jikan:8080` on edge; no name, no
# route). Its databases sit on the stack's own internal network. Secrets come by interpolation from
# secret.sops.env (.doco-cd.yml).
services:
  jikan:
    container_name: jikan
    image: docker.io/jikanme/jikan-rest:v4.2.4@sha256:505f06101617c337db5b301701258de63a55f6593b0181cf2d84c92ff49cee9d
    restart: unless-stopped
    init: true
    user: "10001:10001"
    # The image's entrypoint (docker-entrypoint.php writes .env, then `rr serve`), with RoadRunner
    # at warn: at info its scheduler logs four lines a minute.
    entrypoint: [/bin/sh, -c, "php /app/docker-entrypoint.php && exec rr serve -c .rr.yaml -o logs.level=warn"]
    environment:
      APP_DEBUG: "false"
      LOG_LEVEL: info
      APP_ENV: production
      APP_URL: http://127.0.0.1:8080
      CACHING: "true"
      CACHE_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PASSWORD: ${JIKAN_REDIS_PASSWORD}
      DB_CONNECTION: mongodb
      DB_HOST: mongo
      DB_DATABASE: jikan
      DB_USERNAME: ${JIKAN_DB_USERNAME}
      DB_ADMIN: ${JIKAN_DB_USERNAME}
      DB_PASSWORD: ${JIKAN_DB_PASSWORD}
      SCOUT_DRIVER: typesense
      SCOUT_QUEUE: "false"
      TYPESENSE_HOST: typesense
      TYPESENSE_PORT: "8108"
      TYPESENSE_API_KEY: ${JIKAN_TYPESENSE_API_KEY}
      CORS_MIDDLEWARE: "true"
      MICROCACHING: "true"
      MICROCACHING_EXPIRE: "60"
      MAX_RESULTS_PER_PAGE: "50"
    volumes:
      # v1's query override: filters and searches go through the database, not the search index.
      - ./RepositoryQuery.php:/app/app/Support/RepositoryQuery.php:ro
    mem_limit: 2g
    # edge: aiometadata reaches it, and it reaches MyAnimeList.
    networks: [edge, backend]
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      typesense:
        condition: service_healthy
    healthcheck:
      # The image's own check (RoadRunner's health port), with time to warm up.
      test: [CMD-SHELL, "curl --fail -s -o /dev/null 'http://127.0.0.1:2114/health?plugin=http'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  mongo:
    container_name: jikan-mongo
    # Jikan's compose runs `mongo:focal` (6.0): this is 6.0's last patch. Renovate stays within 6.0.
    image: docker.io/library/mongo:6.0.28-jammy@sha256:a90cef0143bed76540c2b7e6f299a02165e59b07e459b2fd7fef031c5accf5fd
    restart: unless-stopped
    init: true
    # --quiet: no line per connection accepted or closed.
    command: [--wiredTigerCacheSizeGB, "0.5", --quiet]
    ulimits:
      nofile: { soft: 64000, hard: 64000 } # what mongod asks for at start
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${JIKAN_DB_ADMIN_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${JIKAN_DB_ADMIN_PASSWORD}
      MONGO_INITDB_DATABASE: jikan_admin
      # Read by mongo-init.js, which creates the app user on an empty data directory only.
      JIKAN_DB_USERNAME: ${JIKAN_DB_USERNAME}
      JIKAN_DB_PASSWORD: ${JIKAN_DB_PASSWORD}
    stop_grace_period: 60s
    mem_limit: 2g
    # The image declares /data/configdb a volume. A standalone mongod keeps nothing there, so a tmpfs
    # spares the host an anonymous volume.
    tmpfs: [/data/configdb]
    volumes:
      - /opt/appdata/jikan/mongo:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, "mongosh mongodb://localhost:27017 --quiet --eval 'quit(db.runCommand(\"ping\").ok ? 0 : 2)'"]
      # Once a minute (every 5 s while starting): each check still logs four "client metadata" lines.
      interval: 60s
      start_interval: 5s
      timeout: 10s
      retries: 3
      start_period: 60s

  redis:
    container_name: jikan-redis
    image: docker.io/library/redis:6.2.24-alpine@sha256:592b215e9287182f11ba9d7c229dc0ba312bb900a016ea65ae378b0127567319
    restart: unless-stopped
    init: true
    environment:
      JIKAN_REDIS_PASSWORD: ${JIKAN_REDIS_PASSWORD}
    # $$: the container's shell reads it at start, not compose.
    command:
      - /bin/sh
      - -ec
      - exec redis-server --requirepass "$$JIKAN_REDIS_PASSWORD" --appendonly yes --appendfsync everysec --maxmemory 256mb --maxmemory-policy allkeys-lru
    mem_limit: 512m
    volumes:
      - /opt/appdata/jikan/redis:/data # its cache
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, "redis-cli --no-auth-warning -a \"$$JIKAN_REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  typesense:
    container_name: jikan-typesense
    # Jikan's compose pins 0.24.1, and Renovate keeps it there.
    image: docker.io/typesense/typesense:0.24.1@sha256:9bcff2b829f12074426ca044b56160ca9d777a0c488303469143dd9f8259d4dd
    restart: unless-stopped
    init: true
    environment:
      TYPESENSE_API_KEY: ${JIKAN_TYPESENSE_API_KEY}
      GLOG_minloglevel: "1" # warnings and up: at info its raft chatter is two lines every 10 s
    entrypoint: [/opt/typesense-server]
    command: [--data-dir=/data, --thread-pool-size=8, --num-collections-parallel-load=2]
    stop_grace_period: 30s
    mem_limit: 1g
    volumes:
      - /opt/appdata/jikan/typesense:/data # the search index (rebuildable)
    networks: [backend]
    healthcheck:
      # The image has only bash: probe the API port through /dev/tcp.
      test: [CMD, bash, -c, "exec 3<>/dev/tcp/127.0.0.1/8108"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  edge:
    external: true
  # This stack's own: the databases need no internet.
  backend:
    internal: true
