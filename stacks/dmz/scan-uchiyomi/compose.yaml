# Uchiyomi scans its library folders only when asked, and CLU files new comics into one of them:
# doco-cd's scheduler starts this every 30 minutes, and Uchiyomi rescans (at most once a minute).
# A stack of its own, as every job is (stacks/README.md → The folder), and named so that no other
# stack's name begins it: doco-cd would take its exits for that stack's. It calls Uchiyomi as any
# client does, through caddy-apps, by the door's alias on `edge`.
services:
  scan-uchiyomi:
    container_name: scan-uchiyomi
    image: docker.io/curlimages/curl:8.23.0@sha256:6b46ee7c652d53ef17ddf1428b1a365a66d913d21c54df42e2e46d5bd321bb46
    entrypoint: ["/bin/sh", "-c"]
    # $$: read at run time, not by compose.
    command: ['curl -fsS -m 60 -X POST -o /dev/null -H "Authorization: Bearer $$UCHIYOMI_TOKEN" https://uchiyomi.aliammar.net/api/refresh']
    env_file: secret.sops.env # UCHIYOMI_TOKEN: an API token with the write scope (README → Secrets)
    networks: [edge]
    labels:
      cd.doco.job.enabled: "true"
      cd.doco.job.schedule: "@every 30m"
      cd.doco.job.notify_on: failure
networks:
  edge:
    external: true
