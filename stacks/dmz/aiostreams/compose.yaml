# AIOStreams (aiostreams.aliammar.net): a Stremio addon that combines stream sources. Its own login
# plus sign-in through the apps' Authelia (OIDC); public through the tunnel, because Stremio clients
# call it from anywhere. On the macvlan at v1's .65, so rule 820 (usenet) still names it.
services:
  aiostreams:
    container_name: aiostreams
    # v1's build (v1 pinned `nightly` at this digest).
    image: ghcr.io/viren070/aiostreams:2026.08.12.1359-nightly@sha256:c06903e7e17b1e9ae9cf681841fed1fa5a40880420b61781cc8aea5c8fc5b2bd
    restart: unless-stopped
    # secret.sops.env (from v1): SECRET_KEY, DATABASE_URI, AIOSTREAMS_AUTH, and v1's unused OIDC
    # client. oidc.sops.env: AIOSTREAMS_OIDC_CLIENT_SECRET for the apps' Authelia (later files win).
    env_file: [secret.sops.env, oidc.sops.env]
    environment:
      BASE_URL: https://aiostreams.aliammar.net
      SESSION_TTL_SECONDS: "2592000"
      AIOSTREAMS_AUTH_REQUIRED: "true"
      AIOSTREAMS_OIDC_ENABLED: "true"
      AIOSTREAMS_OIDC_ISSUER: https://login.aliammar.net
      AIOSTREAMS_OIDC_CLIENT_ID: aiostreams
      AIOSTREAMS_OIDC_SCOPES: openid profile email groups
      AIOSTREAMS_OIDC_USERNAME_CLAIM: preferred_username
      AIOSTREAMS_OIDC_GROUPS_CLAIM: groups
      AIOSTREAMS_OIDC_GROUP_PERMISSIONS: admins=admin,family=createConfig
      AIOSTREAMS_OIDC_DEFAULT_PERMISSIONS: ""
      AIOSTREAMS_OIDC_ALLOW_LOCAL_LOGIN: "true"
      AIOSTREAMS_OIDC_AUTO_REDIRECT: "false"
      AIOSTREAMS_OIDC_ALLOW_INSECURE_REQUESTS: "false"
    mem_limit: 1g
    volumes:
      - /opt/appdata/aiostreams/data:/app/data # the database (users, configs)
    networks:
      dmz:
        ipv4_address: 10.10.100.65 # ROLE_USENET_CLIENTS (rule 820: usenet ports 119/563)
        gw_priority: 1 # it leaves as .65, so the rule recognises it
      edge: {}
    # The image's own healthcheck (/api/v1/status) applies.
networks:
  dmz:
    external: true
  edge:
    external: true
