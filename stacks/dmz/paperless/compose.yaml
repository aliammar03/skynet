# Paperless-ngx (paperless.aliammar.net): the document archive, with OCR. Its own login; inside only.
# Redis is only its task broker, on the stack's own network.
services:
  paperless:
    container_name: paperless
    image: ghcr.io/paperless-ngx/paperless-ngx:3.2.1@sha256:5fa76604a81df6945086e0837b14b56543d137e8ce4f311cc5d9ebe907e74e79
    restart: unless-stopped
    env_file: secret.sops.env # PAPERLESS_SECRET_KEY, PAPERLESS_ADMIN_PASSWORD
    environment:
      PAPERLESS_URL: https://paperless.aliammar.net
      PAPERLESS_REDIS: redis://redis:6379
      PAPERLESS_DBENGINE: sqlite
      PAPERLESS_TIME_ZONE: Asia/Karachi
      PAPERLESS_OCR_LANGUAGE: eng
      PAPERLESS_ADMIN_USER: aliammar # created on an empty database only; v1's already has it
    # OCR of a large scan is the peak.
    mem_limit: 2g
    volumes:
      - /opt/appdata/paperless/data:/usr/src/paperless/data # sqlite, the search index
      - /opt/appdata/paperless/media:/usr/src/paperless/media # the documents
      - /opt/appdata/paperless/consume:/usr/src/paperless/consume # inbox: files dropped here are imported
      - /opt/appdata/paperless/export:/usr/src/paperless/export
    networks: [edge, backend]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # The image's own check, with time for a first start's migrations.
      test: [CMD, curl, -fsS, -L, --max-time, "2", -o, /dev/null, http://localhost:8000]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

  redis:
    container_name: paperless-redis
    image: docker.io/library/redis:8.10.2-alpine@sha256:0bf6577d7774e592b29d093e3ac9390eb91e13d72c21e506afce736de5e0eeb0
    restart: unless-stopped
    command: [redis-server, --save, "", --appendonly, "no"] # the broker only: nothing to keep
    mem_limit: 128m
    networks: [backend]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  edge:
    external: true
  # This stack's own; redis needs no internet.
  backend:
    internal: true
