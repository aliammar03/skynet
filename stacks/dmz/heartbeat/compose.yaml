# Dead-man for docker-dmz: doco-cd's scheduler starts this every 5 min and it pings healthchecks.io.
# A missed ping means the host, Docker, the doco-cd scheduler or egress is down; healthchecks.io then
# alerts #alerts.
services:
  heartbeat:
    container_name: heartbeat
    image: docker.io/curlimages/curl:8.23.0@sha256:6b46ee7c652d53ef17ddf1428b1a365a66d913d21c54df42e2e46d5bd321bb46
    entrypoint: ["/bin/sh", "-c"]
    # $$: read at run time, not by compose.
    command: ['curl -fsS -m 10 --retry 3 -o /dev/null "$$HC_PING_URL"']
    env_file: secret.sops.env
    networks: [edge]
    labels:
      cd.doco.job.enabled: "true"
      cd.doco.job.schedule: "@every 5m"
      cd.doco.job.notify_on: failure # a success every 5 min would flood #alerts
networks:
  edge:
    external: true
