# Mylar3 (mylar3.aliammar.net) and SABnzbd (sabnzbd.aliammar.net): Western comics from Usenet.
# Mylar3 follows Ali's series (ComicVine), finds their issues on NZBGeek and hands them to SABnzbd,
# which downloads them from Easynews; Mylar3 then files them on Unraid (Books/Comics/mylar3, as
# publisher and series folders), where Komga and Uchiyomi read them. No logins of their own: the apps'
# Authelia guards both (admins). Inside and over Tailscale only. Not on `edge`: caddy-apps is the only
# container that reaches them.
services:
  mylar3:
    container_name: mylar3
    # linuxserver's build tags; Renovate reads them through a versioning rule (renovate.json).
    image: lscr.io/linuxserver/mylar3:v0.11.0-ls277@sha256:85f41065ad9f264f5f9000abcf17215a9b2b0cd207c954fb6b47c6dcf950389f
    restart: unless-stopped
    environment:
      TZ: Asia/Karachi
      # Unraid's nobody:users, who owns everything on the share (all_squash).
      PUID: "99"
      PGID: "100"
    # Measured 2026-10-29: 60 MiB after start and its pages; room for tagging downloads (ComicTagger).
    mem_limit: 512m
    volumes:
      - /opt/appdata/mylar3/config:/config # its database and settings, the ComicVine and NZBGeek keys
      # SABnzbd's downloads, at the path SABnzbd reports them: Mylar3 moves the finished ones out.
      - /var/cache/sabnzbd:/downloads
      # Its comic location. A missing folder fails the start rather than becoming an empty one on
      # this disk.
      - { type: bind, source: /mnt/storage/Books/Comics/mylar3, target: /comics, bind: { create_host_path: false } }
    networks:
      # Shared with caddy-apps alone (internal, from the host's Nix config): it answers without a login.
      door-mylar3: {}
      # The stack's way out (ComicVine, NZBGeek), where it also reaches SABnzbd.
      egress: {}
    healthcheck:
      # A static file: its pages check the comic location's permissions on every load.
      test: [CMD, curl, -fsS, -o, /dev/null, http://127.0.0.1:8090/images/favicon.ico]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  sabnzbd:
    container_name: sabnzbd
    # Its host check admits its own hostname, set at first start: Mylar3 calls it by this name.
    hostname: sabnzbd
    image: lscr.io/linuxserver/sabnzbd:5.1.3-ls279@sha256:a7cfba459929f73b83c98b476a845076dc72524af80b24fcb4200684e6b1b675
    restart: unless-stopped
    environment:
      TZ: Asia/Karachi
      PUID: "99"
      PGID: "100"
    # Measured 2026-10-29: 65 MiB idle. Its article cache adds up to 256 MiB (its default), and par2
    # and unrar run inside the limit too.
    mem_limit: 768m
    volumes:
      - /opt/appdata/mylar3/sabnzbd:/config # its settings (Easynews' login, its API key), queue, history
      # Downloads in progress and finished, on the host's ext4: outside /opt/appdata's snapshots and
      # the backup.
      - /var/cache/sabnzbd:/downloads
    networks:
      door-sabnzbd: {}
      # Easynews over TLS on :443, which the DMZ's web egress already allows (rule 810).
      egress: {}
    healthcheck:
      test: [CMD, curl, -fsS, -o, /dev/null, "http://127.0.0.1:8080/api?mode=version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
networks:
  door-mylar3:
    external: true
  door-sabnzbd:
    external: true
  egress: {}
