# Mylar3 (mylar3.aliammar.net), SABnzbd (sabnzbd.aliammar.net) and JDownloader 2
# (jdownloader.aliammar.net): Western comics. Mylar3 follows Ali's series (ComicVine) and finds their
# issues on NZBGeek, which SABnzbd downloads from Easynews, and on GetComics, whose file-host links
# JDownloader 2 downloads (through Ali's Premiumize); Mylar3 then files them on Unraid
# (Books/Comics/mylar3, as publisher and series folders), where Komga and Uchiyomi read them. No
# logins of their own: the apps' Authelia guards all three (admins). Inside and over Tailscale only.
# Not on `edge`: caddy-apps is the only container that reaches their pages.
services:
  mylar3:
    container_name: mylar3
    # linuxserver's build tags; Renovate reads them through a versioning rule (renovate.json).
    image: lscr.io/linuxserver/mylar3:v0.11.0-ls277@sha256:85f41065ad9f264f5f9000abcf17215a9b2b0cd207c954fb6b47c6dcf950389f
    restart: unless-stopped
    environment:
      TZ: Asia/Karachi
      # Unraid's nobody:users, who owns everything on the share (all_squash).
      PUID: "99"
      PGID: "100"
    # Measured 2026-10-29: 60 MiB after start, 157 MiB at most filing Watchmen's 12 issues.
    mem_limit: 512m
    volumes:
      - /opt/appdata/mylar3/config:/config # its database and settings, the ComicVine and NZBGeek keys
      # SABnzbd's downloads, at the path SABnzbd reports them: Mylar3 moves the finished ones out.
      - /var/cache/sabnzbd:/downloads
      # JDownloader's, at the path Mylar3 hands it as the destination (Mylar3 → Settings → DDL).
      - /var/cache/jdownloader:/jd2
      # Its comic location. A missing folder fails the start rather than becoming an empty one on
      # this disk.
      - { type: bind, source: /mnt/storage/Books/Comics/mylar3, target: /comics, bind: { create_host_path: false } }
    networks:
      # Shared with caddy-apps alone (internal, from the host's Nix config): it answers without a login.
      door-mylar3: {}
      # Its way out (ComicVine, NZBGeek, GetComics).
      egress: {}
      # SABnzbd and JDownloader, by name.
      backend: {}
    healthcheck:
      # A static file: its pages check the comic location's permissions on every load.
      test: [CMD, curl, -fsS, -o, /dev/null, http://127.0.0.1:8090/images/favicon.ico]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  sabnzbd:
    container_name: sabnzbd
    # Its host check admits its own hostname, set at first start: Mylar3 calls it by this name.
    hostname: sabnzbd
    image: lscr.io/linuxserver/sabnzbd:5.1.3-ls279@sha256:a7cfba459929f73b83c98b476a845076dc72524af80b24fcb4200684e6b1b675
    restart: unless-stopped
    environment:
      TZ: Asia/Karachi
      PUID: "99"
      PGID: "100"
    # Measured 2026-10-29: 65 MiB idle, 126 MiB at most downloading and unpacking at 25 MB/s. Its
    # article cache can grow to 192 MiB (its default for this limit), and par2 runs inside it too.
    mem_limit: 768m
    volumes:
      - /opt/appdata/mylar3/sabnzbd:/config # its settings (Easynews' login, its API key), queue, history
      # Downloads in progress and finished, on the host's ext4: outside /opt/appdata's snapshots and
      # the backup.
      - /var/cache/sabnzbd:/downloads
      # Its `clu` category's folder: CLU (stacks/dmz/clu) mounts it at the same path to take its jobs.
      - /var/cache/sabnzbd/clu:/usenet
    networks:
      # Usenet the planned way (skynetv2.md → Conventions → Networks): its own address on the
      # macvlan, which OPNsense names, so it alone leaves on the usenet ports. caddy-apps reaches it
      # here by name; SABnzbd admits only that address to its pages (README).
      dmz:
        ipv4_address: 10.10.100.66 # ROLE_USENET_CLIENTS (rule 820: usenet ports 119/563)
      # Mylar3, by name; internal.
      backend: {}
    healthcheck:
      test: [CMD, curl, -fsS, -o, /dev/null, "http://127.0.0.1:8080/api?mode=version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  jdownloader:
    container_name: jdownloader
    image: docker.io/jlesage/jdownloader-2:v26.09.1@sha256:bd6cd2fdc72818f30207e677b33cd7f1b425048c4e7132624e541e99f992be4c
    restart: unless-stopped
    environment:
      TZ: Asia/Karachi
      USER_ID: "99"
      GROUP_ID: "100"
      DARK_MODE: "1"
      JDOWNLOADER_MAX_MEM: 512M # its Java heap
    # Measured 2026-10-29: 184 MiB after start, 475-500 MiB downloading and unpacking.
    mem_limit: 1g
    volumes:
      # Its settings (Premiumize's login, its local API switched on), its JDownloader updates.
      - /opt/appdata/mylar3/jdownloader:/config
      # Downloads, at the path Mylar3 hands it; on the host's ext4, outside snapshots and backup.
      - /var/cache/jdownloader:/jd2
    networks:
      # Its desktop in the browser (5800), shared with caddy-apps alone.
      door-jdownloader: {}
      # Its way out (file hosts, Premiumize, its own updates).
      egress: {}
      # Mylar3 calls its local API (3128, no login) here.
      backend: {}
    healthcheck:
      # The image has none; its web server answers once the desktop is up.
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:5800/]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
networks:
  door-mylar3:
    external: true
  door-jdownloader:
    external: true
  dmz:
    external: true
  egress: {}
  # The three, by name; no way out, so SABnzbd's only route is its macvlan.
  backend:
    internal: true
