# Komf (P8; Ali, 2026-11-05): metadata and covers for Komga's Manga library, written through Komga's
# API only, never into the files (Uchiyomi's). Upstream's full example: github.com/Snd-R/komf.
# From the environment (komf.sops.env): KOMF_KOMGA_PASSWORD. Comics are left alone: each issue's
# ComicInfo (Metron, through CLU) is right, and every series' cover is CLU's issue #1 (folder.png).
komga:
  baseUri: http://komga:25600 # on the stack's backend
  komgaUser: komf@aliammar.net # Komga's account for it, an admin (only an admin edits metadata)
  eventListener:
    enabled: true # a series added to the Manga library is matched when Komga reports it
    metadataLibraryFilter: [0S2GKXTMMD47G]
    metadataSeriesExcludeFilter: []
    notificationsLibraryFilter: []
  metadataUpdate:
    default:
      updateModes: [API]
      seriesCovers: false
      bookCovers: false
    library:
      # Manga: Uchiyomi's chapters carry only a title and a number, and no cover. Everything a
      # provider has for the series, a field one lacks taken from the next, and its cover art.
      # Titles stay as Uchiyomi's folders name them (the comics agent's links); the others are
      # added as alternative titles, for search.
      0S2GKXTMMD47G:
        libraryType: MANGA
        updateModes: [API]
        aggregate: true
        mergeTags: false
        mergeGenres: false
        seriesCovers: true
        bookCovers: false
        overrideExistingCovers: true
        postProcessing:
          seriesTitle: false
          alternativeSeriesTitles: true
          alternativeSeriesTitleLanguages: [en, ja-ro]
          orderBooks: false

database:
  file: /config/database.sqlite # its matches, in /opt/appdata/komga/komf

metadataProviders:
  defaultProviders:
    mangaUpdates:
      priority: 10
      enabled: false # only the library's own providers, below
  libraryProviders:
    # The series' metadata; a chapter gets its authors and links, but not the series' summary
    # (Ali, 2026-11-05: none of these sources has a chapter's own).
    0S2GKXTMMD47G:
      aniList:
        priority: 10
        enabled: true
        mediaType: MANGA # manga, manhwa and webtoons; not novels
        tagsScoreThreshold: 60
        tagsSizeLimit: 15
        bookMetadata:
          summary: false
      mangaUpdates:
        priority: 20
        enabled: true
        mediaType: MANGA
        authorRoles: [WRITER]
        artistRoles: [PENCILLER, INKER, COLORIST, LETTERER, COVER]
        bookMetadata:
          summary: false
      mangaDex:
        priority: 30
        enabled: true
        coverLanguages: [en, ja]
        bookMetadata:
          summary: false

server:
  port: 8085

logLevel: INFO
