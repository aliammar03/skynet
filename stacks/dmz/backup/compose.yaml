# /opt/appdata to Google Drive every night (restic, run by resticprofile), its weekly check, and the
# restore skynet-restore runs. Three doco-cd one_off jobs: each run is a fresh container from these
# definitions. For backup and restore, doco-cd holds the stateful services stopped (every stack
# whose README classes data as `data`), so the files are cold: no dumps.
x-job: &job
  image: docker.io/creativeprojects/resticprofile:0.33.1@sha256:2422abfaec97a56e1d7937b512fa3676d8bad3801629358eabef19f8fe99321d
  entrypoint: ["/bin/sh", "/etc/resticprofile/run.sh"]
  hostname: docker-dmz # restic's snapshot host, so retention groups every night's together
  env_file: secret.sops.env # RESTIC_PASSWORD, HC_PING_URL
  environment:
    TZ: Asia/Karachi
  volumes:
    - ./run.sh:/etc/resticprofile/run.sh:ro
    - ./profiles.yaml:/etc/resticprofile/profiles.yaml:ro
    - ./excludes.txt:/etc/resticprofile/excludes.txt:ro
    - ./rclone.sops.conf:/etc/rclone/rclone.conf:ro
    - /opt/appdata:/opt/appdata # read-write: restores write
  tmpfs: [/resticprofile] # a volume in the image, unused: no anonymous volume per run
  # Only egress (Drive, healthchecks.io): its own default network, not `edge`.
x-labels: &labels
  cd.doco.job.enabled: "true"
  cd.doco.job.execution_mode: one_off
  cd.doco.job.skip_running: "true"
  cd.doco.job.notify_on: failure
x-stateful: &stateful authelia/authelia,obsidian/obsidian,karakeep/karakeep,paperless/paperless,calibre/calibre,sillytavern/sillytavern,marinara/marinara,jikan/jikan,jikan/mongo,aiometadata/aiometadata,aiostreams/aiostreams,librespeed/librespeed

services:
  backup:
    <<: *job
    container_name: backup
    command: [backup]
    labels:
      <<: *labels
      cd.doco.job.schedule: "30 4 * * *" # after both nodes' guest backups (02:00, 03:30)
      cd.doco.job.stop_services: *stateful
  check:
    <<: *job
    container_name: backup-check
    command: [check]
    labels:
      <<: *labels
      cd.doco.job.schedule: "0 10 * * 0" # Sundays: prune, then read 5% of the data back
  restore:
    <<: *job
    container_name: backup-restore
    command: [restore]
    labels:
      <<: *labels
      # Run only by skynet-restore. doco-cd needs a schedule and refuses one that never comes
      # (30 February); ten years counted from doco-cd's last start never comes either, since every
      # image update restarts it. The job also refuses to run without a fresh restore.request.
      cd.doco.job.schedule: "@every 87600h"
      cd.doco.job.stop_services: *stateful
