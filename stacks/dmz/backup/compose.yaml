# /opt/appdata to Google Drive every night (restic, run by resticprofile), and its weekly check. Two
# doco-cd one_off jobs: each run is a fresh container from these definitions. Hot: nothing stops.
# The source is btrbk's newest snapshot of /opt/appdata (04:20, hosts/docker-dmz), every app's files
# at one instant. Restores are skynet-restore's, on the host.
x-job: &job
  image: docker.io/creativeprojects/resticprofile:0.33.1@sha256:2422abfaec97a56e1d7937b512fa3676d8bad3801629358eabef19f8fe99321d
  entrypoint: ["/bin/sh", "/etc/resticprofile/run.sh"]
  hostname: docker-dmz # restic's snapshot host, so retention groups every night's together
  env_file: secret.sops.env # RESTIC_PASSWORD, HC_PING_URL
  environment:
    TZ: Asia/Karachi
    APPDATA_SNAPSHOT: "true" # run.sh refuses a snapshot more than an hour old
  volumes:
    - ./run.sh:/etc/resticprofile/run.sh:ro
    - ./profiles.yaml:/etc/resticprofile/profiles.yaml:ro
    - ./excludes.txt:/etc/resticprofile/excludes.txt:ro
    - ./rclone.sops.conf:/etc/rclone/rclone.conf:ro
    - /var/cache/restic-appdata:/cache # restic's cache, on the host's ext4
    - /var/lib/node-exporter:/var/lib/node-exporter # the backup's metrics, for node-exporter
    # The newest snapshot, where the live data sits, so restic's paths stay /opt/appdata. Without
    # one, the job fails here instead of backing up an empty folder.
    - type: bind
      source: /mnt/appdata-pool/@snapshots/latest
      target: /opt/appdata
      read_only: true
      bind:
        create_host_path: false
  tmpfs: [/resticprofile] # a volume in the image, unused: no anonymous volume per run
  # Only egress (Drive, healthchecks.io): its own default network, not `edge`.
x-labels: &labels
  cd.doco.job.enabled: "true"
  cd.doco.job.execution_mode: one_off
  cd.doco.job.skip_running: "true"
  cd.doco.job.notify_on: failure

services:
  backup:
    <<: *job
    container_name: backup
    command: [backup]
    labels:
      <<: *labels
      # After btrbk's snapshot (04:20) and both nodes' guest backups (02:00, 03:30).
      cd.doco.job.schedule: "30 4 * * *"
  check:
    <<: *job
    container_name: backup-check
    command: [check]
    labels:
      <<: *labels
      cd.doco.job.schedule: "0 10 * * 0" # Sundays: prune, then read 5% of the data back
