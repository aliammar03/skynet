# Both stores, by container name on `edge`. Fixed uids: the boards in dashboards/ name them.
apiVersion: 1
prune: true # a data source removed here goes from Grafana too
datasources:
  - name: VictoriaMetrics
    uid: victoriametrics
    type: prometheus # VictoriaMetrics answers Prometheus' query API
    access: proxy
    url: http://victoriametrics:8428
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 30s # the scrape interval (scrape.yaml), so $__rate_interval spans two scrapes
  - name: VictoriaLogs
    uid: victorialogs
    type: victoriametrics-logs-datasource # GF_PLUGINS_PREINSTALL_SYNC in compose.yaml
    access: proxy
    url: http://victorialogs:9428
    editable: false
