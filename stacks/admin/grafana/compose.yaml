# Grafana: dashboards over VictoriaMetrics and VictoriaLogs (skynetv2.md → P5 → Grafana). Its data
# sources and boards come from git (provisioning/, dashboards/); you log in through admin
# Authelia's OIDC, and a local admin (secret.sops.env) is the break-glass.
services:
  grafana:
    container_name: grafana
    image: docker.io/grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    restart: unless-stopped
    # GF_SECURITY_ADMIN_PASSWORD (the break-glass), GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET (Authelia's
    # client `grafana`).
    env_file: [secret.sops.env, oidc.sops.env]
    environment:
      TZ: Asia/Karachi
      GF_SERVER_ROOT_URL: https://grafana.aliammar.net
      # Grafana 13 ships no data sources of its own; it fetches them from grafana.com. These two, the
      # only ones the boards use, before it starts, so both data sources work from the first
      # request. Its default list of 18 others, fetched in the background, is off.
      GF_PLUGINS_PREINSTALL_SYNC: victoriametrics-logs-datasource@0.33.1,prometheus
      GF_PLUGINS_PREINSTALL: ""
      GF_LOG_LEVEL: warn # as Authelia: no line per request
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false" # Renovate does that
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_UNIFIED_ALERTING_ENABLED: "false" # alerts are vmalert's and Alertmanager's
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ADMIN_USER: admin
      # Admin Authelia's OIDC (its client `grafana`, oidc-clients.yml), as Authelia's own guide sets
      # it. Grafana reaches auth.aliammar.net on `edge` through caddy-admin's alias for that name.
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Authelia
      GF_AUTH_GENERIC_OAUTH_ICON: signin
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email groups
      GF_AUTH_GENERIC_OAUTH_EMPTY_SCOPES: "false"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://auth.aliammar.net/api/oidc/authorization
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://auth.aliammar.net/api/oidc/token
      GF_AUTH_GENERIC_OAUTH_API_URL: https://auth.aliammar.net/api/oidc/userinfo
      GF_AUTH_GENERIC_OAUTH_AUTH_STYLE: InHeader
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
      GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: name
      GF_AUTH_GENERIC_OAUTH_GROUPS_ATTRIBUTE_PATH: groups
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true" # your account appears at your first login
      # You are Grafana's admin; anyone else is refused (Authelia only lets you have this client
      # anyway).
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "preferred_username == 'aliammar' && 'GrafanaAdmin'"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "true"
      GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "true"
      # Straight to Authelia. The break-glass form: /login?disableAutoLogin.
      GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN: "true"
      GF_AUTH_SIGNOUT_REDIRECT_URL: https://auth.aliammar.net/logout
    # docker-admin has no swap: past this the kernel kills Grafana, not the host. Measured
    # (2026-10-27): about 320 MiB idle, and the old 512 MiB reached with the Live board open,
    # where it stalled (requests failed with "context canceled"), then the kernel killed it.
    mem_limit: 1g
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/etc/grafana/dashboards:ro
      - /opt/appdata/grafana/data:/var/lib/grafana # its database and plugins; cache (not backed up)
    networks: [edge]
    healthcheck:
      test: [CMD, wget, -qO, /dev/null, http://127.0.0.1:3000/api/health]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  edge:
    external: true
