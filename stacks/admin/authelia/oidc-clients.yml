# Admin Authelia's OIDC clients, merged with configuration.yml and the provider's keys
# (oidc.sops.yml). This one file holds the whole client list: a second file's `clients` would replace
# it. Each client_secret is a pbkdf2 digest; the app's plaintext is in its oidc.sops.env.
identity_providers:
  oidc:
    # You alone, with both factors, as for every admin site.
    authorization_policies:
      admin:
        default_policy: deny
        rules:
          - policy: two_factor
            subject: 'user:aliammar'
    # Grafana reads these from the ID token too (Authelia's Grafana guide: Grafana doesn't fetch
    # every claim from userinfo).
    claims_policies:
      grafana:
        id_token: [email, name, groups, preferred_username]
    clients:
      - client_id: grafana
        client_name: Grafana
        client_secret: '$pbkdf2-sha512$310000$XlQ.4QfMIN1kaGTJYIJqQw$zASKmldrGKkdT3GwdFmvDIeZfNTx6JBPG2c5OSiu/LermdFiZKfW2F9C7Jni7vEFstluoq97ltgY7mim8Hi9zg'
        public: false
        authorization_policy: admin
        claims_policy: grafana
        consent_mode: implicit
        require_pkce: true
        pkce_challenge_method: S256
        redirect_uris:
          - https://grafana.aliammar.net/login/generic_oauth
        scopes: [openid, profile, email, groups]
        response_types: [code]
        grant_types: [authorization_code]
        access_token_signed_response_alg: none
        userinfo_signed_response_alg: none
        token_endpoint_auth_method: client_secret_basic # Grafana's auth_style InHeader
      # Technitium's web UI, one client per DNS server (dns/README.md → Logging in); each plaintext
      # is in secrets/<server>.oidc.yaml. ASP.NET's OIDC handler, which Technitium uses, sends the
      # secret in the body, wants the answer posted back as a form, and reads the claims from
      # userinfo (so no claims policy).
      - client_id: technitium-network
        client_name: Technitium (technitium-network)
        client_secret: '$pbkdf2-sha512$310000$XbjWsMOlzs.CrE2AIG71/w$X3VdtevsgGTML.SPiF00AK0520VgRI4y4GQMEnozZk09EEDfEDjL09rdzErdaEzlP6hgdIImhIsr5M.EUvPb7A'
        public: false
        authorization_policy: admin
        consent_mode: implicit
        require_pkce: true
        pkce_challenge_method: S256
        redirect_uris:
          - https://technitium-network.aliammar.net/sso/callback
        scopes: [openid, profile, email, groups]
        response_types: [code]
        response_modes: [form_post]
        grant_types: [authorization_code]
        access_token_signed_response_alg: none
        userinfo_signed_response_alg: none
        token_endpoint_auth_method: client_secret_post
      - client_id: technitium-core
        client_name: Technitium (technitium-core)
        client_secret: '$pbkdf2-sha512$310000$d45TPwao2cz57ashZeNH3w$JxA92SiP2UoPYX95zBfOq1wYqwTNWYKCf5Kx//UQc7qgOU.VzYzlhNzMETPG0VHWWmr6EW95qNieyDWoiIuWVA'
        public: false
        authorization_policy: admin
        consent_mode: implicit
        require_pkce: true
        pkce_challenge_method: S256
        redirect_uris:
          - https://technitium-core.aliammar.net/sso/callback
        scopes: [openid, profile, email, groups]
        response_types: [code]
        response_modes: [form_post]
        grant_types: [authorization_code]
        access_token_signed_response_alg: none
        userinfo_signed_response_alg: none
        token_endpoint_auth_method: client_secret_post
