# Authelia 4.39. Secrets come from the environment (secret.sops.env), never this file.
theme: auto

server:
  address: tcp://:9091
  endpoints:
    authz:
      forward-auth:
        implementation: ForwardAuth

log:
  # As the apps' Authelia: each anonymous request is an info line, so a client retrying one in a
  # loop floods the journal. Warnings and errors (failed logins among them) stay.
  level: warn

authentication_backend:
  password_reset:
    disable: true # one user; the password changes via users.sops.yml (PR)
  file:
    path: /etc/authelia/users.yml
    password:
      algorithm: argon2

# A passkey is one factor; `two_factor` then also asks for the password.
webauthn:
  display_name: Skynet
  enable_passkey_login: true

totp:
  issuer: aliammar.net

access_control:
  default_policy: deny
  rules:
    # The agent reads Gatus's API without a login.
    - domain: status.aliammar.net
      resources: ['^/api/']
      networks: [10.10.90.91/32]
      policy: bypass
    # And the stores' query APIs: read paths only. VictoriaMetrics' writes and deletes are under
    # /api/v1/ too (import, write, admin/tsdb/delete_series), so its paths are listed one by one.
    - domain: metrics.aliammar.net
      resources:
        - '^/api/v1/(query|query_range|series|labels|label/[^/]+/values|metadata|targets|status/[a-z_]+|export)([/?]|$)'
      networks: [10.10.90.91/32]
      policy: bypass
    - domain: logs.aliammar.net
      resources: ['^/select/logsql/']
      networks: [10.10.90.91/32]
      policy: bypass
    # And Alertmanager: reading alerts and silences; setting a silence and expiring one (the agent's
    # silences verb, AGENTS.md). Nothing else writes: POST /api/v2/alerts needs the login.
    - domain: alerts.aliammar.net
      resources: ['^/api/v2/(alerts|alerts/groups|silences|silence/[^/?]+|status)([?]|$)']
      methods: [GET, HEAD]
      networks: [10.10.90.91/32]
      policy: bypass
    - domain: alerts.aliammar.net
      resources: ['^/api/v2/silences$']
      methods: [POST]
      networks: [10.10.90.91/32]
      policy: bypass
    - domain: alerts.aliammar.net
      resources: ['^/api/v2/silence/[^/?]+$']
      methods: [DELETE]
      networks: [10.10.90.91/32]
      policy: bypass
    - domain: '*.aliammar.net'
      policy: two_factor

session:
  cookies:
    - domain: aliammar.net
      authelia_url: https://auth.aliammar.net

storage:
  local:
    path: /data/db.sqlite3

# No mail server: one-time codes (e.g. registering a passkey) land in this file on docker-admin.
notifier:
  filesystem:
    filename: /data/notification.txt
