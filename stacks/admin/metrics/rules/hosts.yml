# Every host: reachability, disks, memory, units (skynetv2.md → P5 → Alerts). `instance` is the
# host, so a host that's down mutes its other alerts (Alertmanager's inhibit rule). Containers'
# restarts are counted in the logs (stacks/admin/logs/rules): cAdvisor's start time is the
# container's creation, which a restart doesn't change.
groups:
  - name: hosts
    rules:
      - alert: HostDown
        expr: up{job="node"} == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }} is down: its node-exporter hasn't answered for 5 minutes."

      - alert: TargetDown
        expr: up{job!="node"} == 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.job }} on {{ $labels.instance }} hasn't answered VictoriaMetrics for 5 minutes."

      # / and /nix/store are one filesystem, as are /opt/appdata and docker-dmz's pool: one each.
      # Unraid (unraid/) fills its array disks (/mnt/diskN) past 90% by design, and its root (rootfs)
      # lives in RAM: neither counts.
      - alert: DiskFull
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|rootfs|overlay|squashfs|nsfs|autofs|nfs.*|fuse.*",mountpoint!~"/nix/store|/mnt/appdata-pool|/mnt/disk[0-9]+"}
            / node_filesystem_size_bytes < 0.10
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }}: {{ $labels.mountpoint }} has {{ $value | humanizePercentage }} free."

      - alert: DiskFillsWithinADay
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|rootfs|overlay|squashfs|nsfs|autofs|nfs.*|fuse.*",mountpoint!~"/nix/store|/mnt/appdata-pool|/mnt/disk[0-9]+"}[6h], 24 * 3600) < 0
            and node_filesystem_avail_bytes / node_filesystem_size_bytes < 0.25
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: {{ $labels.mountpoint }} fills within a day at the last 6 hours' rate."

      - alert: MemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }} has {{ $value | humanizePercentage }} of its memory available."

      # Containers' OOM kills count here too (the kernel's counter is host-wide). VictoriaMetrics
      # counts a small counter's first sample from 0, so a new host's first scrape would report every
      # kill since its boot: the series must be 10 minutes old.
      - alert: OOMKill
        expr: increase(node_vmstat_oom_kill[10m]) > 0 and node_vmstat_oom_kill offset 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: the kernel killed a process for lack of memory in the last 10 minutes; its journal names it."

      - alert: UnitFailed
        expr: node_systemd_unit_state{state="failed"} == 1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: {{ $labels.name }} failed."

      # Disks of the hosts that have their own: the Proxmox nodes (pve/: Debian's textfile timers,
      # every 15 minutes) and Unraid (unraid/: smartctl-exporter). SMART's self-assessment, and
      # NVMe's critical-warning bitmap (spare below its threshold, temperature, reliability,
      # read-only, backup power).
      - alert: DiskUnhealthy
        expr: |
          smartmon_device_smart_healthy == 0 or nvme_critical_warning > 0
            or smartctl_device_smart_status == 0 or smartctl_device_critical_warning > 0
        for: 15m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }}: disk {{ or $labels.disk $labels.device }} reports itself failing (SMART or NVMe); smartctl -a says how."

      # Wear as a ratio: Debian's NVMe timer gives one, smartctl-exporter a percentage.
      - alert: DiskWearing
        expr: nvme_percentage_used_ratio >= 0.80 or smartctl_device_percentage_used / 100 >= 0.80
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: disk {{ $labels.device }} has used {{ $value | humanizePercentage }} of its rated writes."
