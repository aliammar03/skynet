# OPNsense and Omada, through their exporters (stacks/admin/exporters, stacks/admin/omada-exporter;
# skynetv2.md → P5 → Wider eyes). `instance` is opnsense or omada (scrape.yaml).
groups:
  - name: network
    rules:
      # The exporters answer even when they can't read their appliance: a wrong key or user, a page
      # the user lost, or the API down. Their other series stop then, and every rule on them goes
      # quiet. opnsense-exporter says so (opnsense_up 0); OmadaBridge has no such metric (a failed
      # call is only in its log), so answering without a single device is its tell.
      - alert: ExporterBlind
        expr: |
          opnsense_up == 0
            or (up{job="omada"} == 1 unless on () count(omada_device_uptime_seconds) > 0)
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: its exporter answers but can't read the appliance's API (its key or user, or the API): the alerts and graphs on it are blind."

      # Omada's controller lists every adopted device with its state, and OmadaBridge puts that in
      # `device_status` (Connected, Disconnected, Upgrading, Rebooting, Pending, …). 15 minutes not
      # connected outlasts a reboot or a firmware upgrade: an AP or the switch is out.
      - alert: OmadaDeviceDown
        expr: omada_device_uptime_seconds{device_status!~"Connected.*"}
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Omada: {{ $labels.device_name }} ({{ $labels.device_show_model }}, {{ $labels.device_ip }}) is {{ $labels.device_status }}."

      # dpinger's own verdict per gateway (0 offline, 1 online, 2 unknown, 3 pending, 4 loss,
      # 5 latency, 6 forced offline). Only one that was online this week: a monitored gateway that
      # never comes up (an IPv6 one, with no IPv6 from the ISP) would otherwise post forever.
      - alert: GatewayDown
        expr: |
          opnsense_gateways_status == 0
            and on (name) max_over_time((opnsense_gateways_status == bool 1)[7d:5m]) == 1
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "OPNsense: gateway {{ $labels.name }} ({{ $labels.address }}) is offline."

      - alert: GatewayLossy
        expr: opnsense_gateways_loss_percentage > 5
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "OPNsense: gateway {{ $labels.name }} ({{ $labels.address }}) loses {{ $value }}% of its probes."

      # Past the limit pf drops new connections, the whole lab's at once.
      - alert: FirewallStatesHigh
        expr: opnsense_pf_states_current / opnsense_pf_states_limit > 0.80
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "OPNsense: pf's state table is {{ $value | humanizePercentage }} full; past its limit new connections drop."
