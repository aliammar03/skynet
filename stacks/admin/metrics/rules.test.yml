# Unit tests for rules/ (vmalert-tool, in CI): the rules whose meaning depends on how the exporters
# count, with synthetic series. Outside rules/, so vmalert doesn't load it as a rule file.
rule_files:
  - rules/backups.yml
  - rules/deploys.yml
  - rules/network.yml
  - rules/dns.yml
  - rules/hosts.yml
evaluation_interval: 1m
tests:
  # doco-cd counts every poll in polls_total and the failed ones in poll_errors_total too.
  - name: doco-cd polls
    interval: 1m
    input_series:
      # healthy: polls every minute, three old failures
      - series: 'doco_cd_polls_total{instance="healthy",job="doco-cd",repository="r"}'
        values: "0+1x60"
      - series: 'doco_cd_poll_errors_total{instance="healthy",job="doco-cd",repository="r"}'
        values: "3x60"
      # failing: still polls every minute, but each poll fails from minute 10 on
      - series: 'doco_cd_polls_total{instance="failing",job="doco-cd",repository="r"}'
        values: "0+1x60"
      - series: 'doco_cd_poll_errors_total{instance="failing",job="doco-cd",repository="r"}'
        values: "_x9 1+1x50"
      # stopped: the counter stands still
      - series: 'doco_cd_polls_total{instance="stopped",job="doco-cd",repository="r"}'
        values: "5x60"
    alert_rule_test:
      - eval_time: 55m
        groupname: deploys
        alertname: DocoCdNotPolling
        exp_alerts:
          - exp_labels: { instance: failing, job: doco-cd, repository: r, severity: warning }
            exp_annotations:
              summary: "doco-cd on failing hasn't polled main successfully for 30 minutes (no poll ran, or each failed: its log says why)."
          - exp_labels: { instance: stopped, job: doco-cd, repository: r, severity: warning }
            exp_annotations:
              summary: "doco-cd on stopped hasn't polled main successfully for 30 minutes (no poll ran, or each failed: its log says why)."
  # doco-cd holds a repository's polls while one of its one-off jobs runs. held: a 3-hour sync whose
  # gauge appears only when it starts (as after a restart of doco-cd), then polls again: no alert.
  # hung: a job still running past 8 hours: the alert comes back.
  - name: doco-cd polls held by a job
    interval: 1m
    input_series:
      - series: 'doco_cd_polls_total{instance="held",job="doco-cd",repository="r"}'
        values: "0+1x60 60x180 61+1x60"
      - series: 'doco_cd_scheduled_runs_active{context="default",execution_mode="one_off",exported_job="pbs-offsite",instance="held",job="doco-cd",mode="container",stack="pbs-offsite"}'
        values: "_x60 1x180 0x60"
      - series: 'doco_cd_polls_total{instance="hung",job="doco-cd",repository="r"}'
        values: "0+1x60 60x600"
      - series: 'doco_cd_scheduled_runs_active{context="default",execution_mode="one_off",exported_job="pbs-offsite",instance="hung",job="doco-cd",mode="container",stack="pbs-offsite"}'
        values: "0x60 1x600"
    alert_rule_test:
      - eval_time: 3h
        groupname: deploys
        alertname: DocoCdNotPolling
        exp_alerts: []
      - eval_time: 9h30m
        groupname: deploys
        alertname: DocoCdNotPolling
        exp_alerts:
          - exp_labels: { instance: hung, job: doco-cd, repository: r, severity: warning }
            exp_annotations:
              summary: "doco-cd on hung hasn't polled main successfully for 30 minutes (no poll ran, or each failed: its log says why)."
  # A store that starts empty (a restore) meets doco-cd's counters mid-count. The first poll it sees
  # failed and the next ones (every 3 minutes) didn't: no alert.
  - name: doco-cd polls, store starting empty
    interval: 1m
    input_series:
      - series: 'doco_cd_polls_total{instance="fresh",job="doco-cd",repository="r"}'
        values: "500x2 501x2 502x2 503x2 504x2 505x2 506x2 507x2"
      - series: 'doco_cd_poll_errors_total{instance="fresh",job="doco-cd",repository="r"}'
        values: "40x2 41x21"
    alert_rule_test:
      - eval_time: 5m
        groupname: deploys
        alertname: DocoCdNotPolling
        exp_alerts: []
      - eval_time: 20m
        groupname: deploys
        alertname: DocoCdNotPolling
        exp_alerts: []

  # The delivery heartbeat fires only while the webhook exists and no Discord post failed lately.
  - name: delivery heartbeat, Discord working
    interval: 1m
    input_series:
      - series: 'alertmanager_notifications_failed_total{instance="alertmanager",integration="discord",job="alertmanager",reason="other"}'
        values: "0x60"
      - series: 'gatus_results_endpoint_success{group="job",instance="gatus",job="gatus",key="job_discord-webhook",name="discord webhook",type="HTTP"}'
        values: "1x60"
    alert_rule_test:
      - eval_time: 20m
        groupname: alerting
        alertname: DeliveryWatchdog
        exp_alerts:
          - exp_labels: { severity: none }
            exp_annotations:
              summary: "Firing while Discord takes #alerts' posts: the delivery heartbeat to healthchecks.io."
  - name: delivery heartbeat, posts failing
    interval: 1m
    input_series:
      - series: 'alertmanager_notifications_failed_total{instance="alertmanager",integration="discord",job="alertmanager",reason="other"}'
        values: "0x20 1+1x40"
      - series: 'gatus_results_endpoint_success{group="job",instance="gatus",job="gatus",key="job_discord-webhook",name="discord webhook",type="HTTP"}'
        values: "1x60"
    alert_rule_test:
      - eval_time: 30m
        groupname: alerting
        alertname: DeliveryWatchdog
        exp_alerts: []
  - name: delivery heartbeat, webhook gone
    interval: 1m
    input_series:
      - series: 'alertmanager_notifications_failed_total{instance="alertmanager",integration="discord",job="alertmanager",reason="other"}'
        values: "0x60"
      - series: 'gatus_results_endpoint_success{group="job",instance="gatus",job="gatus",key="job_discord-webhook",name="discord webhook",type="HTTP"}'
        values: "0x60"
    alert_rule_test:
      - eval_time: 20m
        groupname: alerting
        alertname: DeliveryWatchdog
        exp_alerts: []

  # vlagent's buffer growing, and its dropped bytes.
  - name: log path
    interval: 1m
    input_series:
      - series: 'vlagent_remotewrite_pending_data_bytes{instance="vlagent",job="vlagent"}'
        values: "0x5 20971520x30"
      - series: 'vm_persistentqueue_bytes_dropped_total{instance="vlagent",job="vlagent",path="/buffer"}'
        values: "0x20 4096x20"
    alert_rule_test:
      - eval_time: 25m
        groupname: log path
        alertname: LogForwardingStuck
        exp_alerts:
          - exp_labels: { instance: vlagent, job: vlagent, severity: warning }
            exp_annotations:
              summary: "vlagent holds 20MiB of logs that VictoriaLogs hasn't taken for 15 minutes."
      - eval_time: 25m
        groupname: log path
        alertname: LogsLost
        exp_alerts:
          - exp_labels: { instance: vlagent, job: vlagent, path: /buffer, severity: warning }
            exp_annotations:
              summary: "vlagent dropped logs in the last hour: its buffer filled or VictoriaLogs refused them."

  # PVE's guests against PBS's backup groups: only a guest with none in its node's namespace, not
  # excluded or a template, and only while PBS answers.
  - name: guests never backed up
    interval: 1m
    input_series:
      - series: 'pve_guest_info{id="qemu/5040",instance="proxmox-network",job="pve",name="docker-admin",node="server-proxmox-network",template="0",type="qemu"}'
        values: "1x1700"
      - series: 'pve_guest_info{id="qemu/2020",instance="proxmox-core",job="pve",name="vm-unraid",node="server-proxmox-core",template="0",type="qemu"}'
        values: "1x1700"
      - series: 'pve_guest_info{id="qemu/9000",instance="proxmox-core",job="pve",name="template",node="server-proxmox-core",template="1",type="qemu"}'
        values: "1x1700"
      - series: 'pve_guest_info{id="lxc/9999",instance="proxmox-core",job="pve",name="new-guest",node="server-proxmox-core",template="0",type="lxc"}'
        values: "1x1700"
      # moved to the core node, its backups still only in the network node's namespace
      - series: 'pve_guest_info{id="qemu/10010",instance="proxmox-core",job="pve",name="docker-dmz",node="server-proxmox-core",template="0",type="qemu"}'
        values: "1x1700"
      - series: 'pbs_snapshot_vm_last_timestamp{datastore="skynet",instance="pbs",job="pbs",namespace="network",vm_id="5040",vm_name="docker-admin"}'
        values: "0x1700"
      - series: 'pbs_snapshot_vm_last_timestamp{datastore="skynet",instance="pbs",job="pbs",namespace="network",vm_id="10010",vm_name="docker-dmz"}'
        values: "0x1700"
      - series: 'pbs_up{instance="pbs",job="pbs"}'
        values: "1x1700"
    alert_rule_test:
      - eval_time: 25h
        groupname: backups
        alertname: GuestNeverBackedUp
        exp_alerts: []
      - eval_time: 27h
        groupname: backups
        alertname: GuestNeverBackedUp
        exp_alerts:
          - exp_labels: { id: lxc/9999, instance: proxmox-core, job: pve, name: new-guest, namespace: core, node: server-proxmox-core, template: "0", type: lxc, vm_id: "9999", severity: critical }
            exp_annotations:
              summary: "new-guest (9999, core): PBS has no backup of it in that namespace."
          - exp_labels: { id: qemu/10010, instance: proxmox-core, job: pve, name: docker-dmz, namespace: core, node: server-proxmox-core, template: "0", type: qemu, vm_id: "10010", severity: critical }
            exp_annotations:
              summary: "docker-dmz (10010, core): PBS has no backup of it in that namespace."

  # Backups past 26 hours, only of the guests PVE has now and in their node's namespace. The test's
  # clock starts at 2000-01-01 (946684800), so a value of 946684800+60 is a backup every minute.
  - name: stale backups
    interval: 1m
    input_series:
      # last backed up at the start
      - series: 'pve_guest_info{id="qemu/5040",instance="proxmox-network",job="pve",name="docker-admin",node="server-proxmox-network",template="0",type="qemu"}'
        values: "1x1700"
      - series: 'pbs_snapshot_vm_last_timestamp{datastore="skynet",instance="pbs",job="pbs",namespace="network",vm_id="5040",vm_name="docker-admin"}'
        values: "946684800x1700"
      # backed up all along
      - series: 'pve_guest_info{id="qemu/7051",instance="proxmox-core",job="pve",name="technitium-core",node="server-proxmox-core",template="0",type="qemu"}'
        values: "1x1700"
      - series: 'pbs_snapshot_vm_last_timestamp{datastore="skynet",instance="pbs",job="pbs",namespace="core",vm_id="7051",vm_name="technitium-core"}'
        values: "946684800+60x1700"
      # moved to the core node and backed up there; its old network backups stay behind
      - series: 'pve_guest_info{id="qemu/10010",instance="proxmox-core",job="pve",name="docker-dmz",node="server-proxmox-core",template="0",type="qemu"}'
        values: "1x1700"
      - series: 'pbs_snapshot_vm_last_timestamp{datastore="skynet",instance="pbs",job="pbs",namespace="core",vm_id="10010",vm_name="docker-dmz"}'
        values: "946684800+60x1700"
      - series: 'pbs_snapshot_vm_last_timestamp{datastore="skynet",instance="pbs",job="pbs",namespace="network",vm_id="10010",vm_name="docker-dmz"}'
        values: "946684800x1700"
      # retired: PVE has no such guest, PBS keeps its backups
      - series: 'pbs_snapshot_vm_last_timestamp{datastore="skynet",instance="pbs",job="pbs",namespace="core",vm_id="10020",vm_name="retired"}'
        values: "946684800x1700"
    alert_rule_test:
      - eval_time: 25h
        groupname: backups
        alertname: GuestBackupStale
        exp_alerts: []
      - eval_time: 27h
        groupname: backups
        alertname: GuestBackupStale
        exp_alerts:
          - exp_labels: { datastore: skynet, instance: pbs, job: pbs, namespace: network, vm_id: "5040", vm_name: docker-admin, severity: critical }
            exp_annotations:
              summary: "docker-admin (5040, network): its newest backup is 1d 3h 0m 0s old."

  # PBS's API down: pbs_up 0 alerts, and with PBS's metrics gone no guest reads as never backed up.
  - name: PBS API down
    interval: 1m
    input_series:
      - series: 'pve_guest_info{id="qemu/5040",instance="proxmox-network",job="pve",name="docker-admin",node="server-proxmox-network",template="0",type="qemu"}'
        values: "1x1700"
      - series: 'pbs_up{instance="pbs",job="pbs"}'
        values: "0x1700"
    alert_rule_test:
      - eval_time: 15m
        groupname: backups
        alertname: PbsApiDown
        exp_alerts:
          - exp_labels: { instance: pbs, job: pbs, severity: critical }
            exp_annotations:
              summary: "pbs-exporter can't read PBS's API, so no guest's backup is watched."
      - eval_time: 27h
        groupname: backups
        alertname: GuestNeverBackedUp
        exp_alerts: []

  # OPNsense's gateways (opnsense-exporter: 0 offline, 1 online, 6 forced offline). Only a gateway
  # that was online this week counts as down: a monitored one that never came up (an IPv6 gateway
  # with no IPv6 from the ISP) or one a person turned off stays quiet.
  - name: OPNsense gateways
    interval: 1m
    input_series:
      # wan: online for 30 minutes, then offline
      - series: 'opnsense_gateways_status{address="203.0.113.1",default_gateway="true",instance="opnsense",job="opnsense",name="WAN_DHCP",opnsense_instance="opnsense"}'
        values: "1x30 0x30"
      # wan6: monitored, never up
      - series: 'opnsense_gateways_status{address="2001:db8::1",default_gateway="false",instance="opnsense",job="opnsense",name="WAN_DHCP6",opnsense_instance="opnsense"}'
        values: "0x60"
      # spare: forced offline
      - series: 'opnsense_gateways_status{address="198.51.100.1",default_gateway="false",instance="opnsense",job="opnsense",name="SPARE",opnsense_instance="opnsense"}'
        values: "6x60"
    alert_rule_test:
      - eval_time: 33m
        groupname: network
        alertname: GatewayDown
        exp_alerts: []
      - eval_time: 45m
        groupname: network
        alertname: GatewayDown
        exp_alerts:
          - exp_labels: { address: 203.0.113.1, default_gateway: "true", instance: opnsense, job: opnsense, name: WAN_DHCP, opnsense_instance: opnsense, severity: critical }
            exp_annotations:
              summary: "OPNsense: gateway WAN_DHCP (203.0.113.1) is offline."

  # OmadaBridge has no metric for a failed controller call: answering with no device is blind.
  # (Each case is its own test: the rule counts every device series there is.)
  - name: Omada exporter blind
    interval: 1m
    input_series:
      - series: 'up{instance="omada",job="omada"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 15m
        groupname: network
        alertname: ExporterBlind
        exp_alerts:
          - exp_labels: { instance: omada, job: omada, severity: warning }
            exp_annotations:
              summary: "omada: its exporter answers but can't read the appliance's API (its key or user, or the API): the alerts and graphs on it are blind."
  - name: Omada exporter reading devices
    interval: 1m
    input_series:
      - series: 'up{instance="omada",job="omada"}'
        values: "1x30"
      - series: 'omada_device_uptime_seconds{device_name="ap",instance="omada",job="omada"}'
        values: "100+60x30"
    alert_rule_test:
      - eval_time: 15m
        groupname: network
        alertname: ExporterBlind
        exp_alerts: []

  # technitium-stats' last hour: SERVFAIL over 5% of 200 queries or more alerts; a quiet server's
  # few failures don't.
  - name: DNS failing
    interval: 1m
    input_series:
      - series: 'technitium_queries_last_hour{instance="busy",job="node"}'
        values: "1000x30"
      - series: 'technitium_responses_last_hour{instance="busy",job="node",rcode="server_failure"}'
        values: "80x30"
      - series: 'technitium_queries_last_hour{instance="quiet",job="node"}'
        values: "50x30"
      - series: 'technitium_responses_last_hour{instance="quiet",job="node",rcode="server_failure"}'
        values: "10x30"
    alert_rule_test:
      - eval_time: 20m
        groupname: dns
        alertname: DnsFailing
        exp_alerts:
          - exp_labels: { instance: busy, job: node, severity: warning }
            exp_annotations:
              summary: "busy: 8% of the last hour's queries got SERVFAIL (no forwarder answered)."

  # Unraid: its array disks fill past 90% by design and its root lives in RAM; its pool counts.
  # smartctl-exporter's wear is a percentage, shown as a ratio like the NVMe timer's.
  - name: Unraid disks
    interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{device="/dev/md1p1",fstype="xfs",instance="unraid",job="node",mountpoint="/mnt/disk1"}'
        values: "5x90"
      - series: 'node_filesystem_size_bytes{device="/dev/md1p1",fstype="xfs",instance="unraid",job="node",mountpoint="/mnt/disk1"}'
        values: "100x90"
      - series: 'node_filesystem_avail_bytes{device="rootfs",fstype="rootfs",instance="unraid",job="node",mountpoint="/"}'
        values: "5x90"
      - series: 'node_filesystem_size_bytes{device="rootfs",fstype="rootfs",instance="unraid",job="node",mountpoint="/"}'
        values: "100x90"
      - series: 'node_filesystem_avail_bytes{device="/dev/nvme0n1p1",fstype="btrfs",instance="unraid",job="node",mountpoint="/mnt/cache"}'
        values: "5x90"
      - series: 'node_filesystem_size_bytes{device="/dev/nvme0n1p1",fstype="btrfs",instance="unraid",job="node",mountpoint="/mnt/cache"}'
        values: "100x90"
      - series: 'smartctl_device_percentage_used{device="nvme0",instance="unraid",job="smartctl"}'
        values: "85x90"
    alert_rule_test:
      - eval_time: 10m
        groupname: hosts
        alertname: DiskFull
        exp_alerts:
          - exp_labels: { device: /dev/nvme0n1p1, fstype: btrfs, instance: unraid, job: node, mountpoint: /mnt/cache, severity: critical }
            exp_annotations:
              summary: "unraid: /mnt/cache has 5% free."
      - eval_time: 70m
        groupname: hosts
        alertname: DiskWearing
        exp_alerts:
          - exp_labels: { device: nvme0, instance: unraid, job: smartctl, severity: warning }
            exp_annotations:
              summary: "unraid: disk nvme0 has used 85% of its rated writes."

  # A new host's counter already holds its kills since boot, which VictoriaMetrics would count as
  # new on its first scrape. Only a kill after its first 10 minutes alerts.
  - name: OOM kills
    interval: 1m
    input_series:
      - series: 'node_vmstat_oom_kill{instance="new",job="node"}'
        values: "1x40"
      - series: 'node_vmstat_oom_kill{instance="old",job="node"}'
        values: "0x20 1x20"
    alert_rule_test:
      - eval_time: 5m
        groupname: hosts
        alertname: OOMKill
        exp_alerts: []
      - eval_time: 25m
        groupname: hosts
        alertname: OOMKill
        exp_alerts:
          - exp_labels: { instance: old, job: node, severity: warning }
            exp_annotations:
              summary: "old: the kernel killed a process for lack of memory in the last 10 minutes; its journal names it."
