# /opt/appdata to Google Drive every night (restic, run by resticprofile), and its weekly check. Two
# doco-cd one_off jobs: each run is a fresh container from these definitions. Hot: nothing stops.
# The one database here is Authelia's small SQLite file, read in milliseconds at 04:30, when nobody
# logs in. Restores are skynet-restore's, on the host.
x-job: &job
  image: docker.io/creativeprojects/resticprofile:0.33.1@sha256:4c235a1448bea30d69375033fb5c6eb37724e2b155f6ab10fbf8d18c8cf4a347
  entrypoint: ["/bin/sh", "/etc/resticprofile/run.sh"]
  hostname: docker-admin # restic's snapshot host, so retention groups every night's together
  env_file: secret.sops.env # RESTIC_PASSWORD, HC_PING_URL
  environment:
    TZ: Asia/Karachi
  volumes:
    - ./run.sh:/etc/resticprofile/run.sh:ro
    - ./profiles.yaml:/etc/resticprofile/profiles.yaml:ro
    - ./excludes.txt:/etc/resticprofile/excludes.txt:ro
    - ./rclone.sops.conf:/etc/rclone/rclone.conf:ro
    - /var/cache/restic-appdata:/cache # restic's cache, on the host
    - /var/lib/node-exporter:/var/lib/node-exporter # the backup's metrics, for node-exporter
    - /opt/appdata:/opt/appdata:ro
  tmpfs: [/resticprofile] # a volume in the image, unused: no anonymous volume per run
  # Only egress (Drive, healthchecks.io): its own default network, not `edge`.
x-labels: &labels
  cd.doco.job.enabled: "true"
  cd.doco.job.execution_mode: one_off
  cd.doco.job.skip_running: "true"
  cd.doco.job.notify_on: failure

services:
  backup:
    <<: *job
    container_name: backup
    command: [backup]
    labels:
      <<: *labels
      cd.doco.job.schedule: "30 4 * * *" # after both nodes' guest backups (02:00, 03:30)
  check:
    <<: *job
    container_name: backup-check
    command: [check]
    labels:
      <<: *labels
      cd.doco.job.schedule: "0 10 * * 0" # Sundays: prune, then read 5% of the data back
