# One row per thing. `service`: each admin UI directly. `door`: caddy-admin + its wildcard cert +
# Authelia, which every admin site shares, so one check covers the door for all of them. `job`: a
# scheduled job's healthchecks.io state (its container is stopped between runs, so Docker can't say).
# `dns`: one suite per Technitium server (below), so a server is one row with its checks as steps.
x-service: &service
  group: service
  interval: 60s
  conditions: ["[CONNECTED] == true"]
  alerts: [{ type: discord }]
# An app on another host, through its door by name (Technitium → the door; rule 235).
x-app: &app
  group: app
  interval: 60s
  alerts: [{ type: discord }]
# An app behind the apps' Authelia: its door answers 302 to the login (the app itself is its
# container's healthcheck). Authelia redirects only a client that asks for HTML; without the header
# it answers 401.
x-forward: &forward
  <<: *app
  client: { ignore-redirect: true }
  headers: { Accept: text/html }
  conditions: ["[STATUS] == 302"]

# Suite steps. Each alerts on its own (Gatus has no suite-level alerts), and an alert names only the
# step, so step names carry the server. `always-run`: a failed step doesn't skip the others.
x-step: &step
  always-run: true
  alerts: [{ type: discord }]
x-ui: &ui
  <<: *step
  conditions: ["[CONNECTED] == true"]
x-zone: &zone # the zone answers from git
  <<: *step
  dns: { query-name: auth.aliammar.net, query-type: A }
  conditions: ["[DNS_RCODE] == NOERROR", "[BODY] == 10.10.60.60"]
# A type a name lacks is "no record" (NOERROR), never NXDOMAIN: musl and resolved would then treat
# the whole name as missing.
x-aaaa: &aaaa
  <<: *step
  dns: { query-name: auth.aliammar.net, query-type: AAAA }
  conditions: ["[DNS_RCODE] == NOERROR"]
x-forwarding: &forwarding # a public name resolves
  <<: *step
  dns: { query-name: google.com, query-type: A }
  conditions: ["[DNS_RCODE] == NOERROR"]
x-blocking: &blocking # googlesyndication.com is on HaGeZi Pro
  <<: *step
  dns: { query-name: googlesyndication.com, query-type: A }
  conditions: ["[DNS_RCODE] == NXDOMAIN"]

endpoints:
  - name: caddy-admin + authelia
    group: door
    url: https://auth.aliammar.net/api/health
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts: [{ type: discord }]
  # The apps door: its own Authelia behind caddy-apps (10.10.100.35 via Technitium; rule 235).
  - name: caddy-apps + authelia
    group: door
    url: https://login.aliammar.net/api/health
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts: [{ type: discord }]
  # The same URL as the internet sees it: public DNS (rule 840), Cloudflare, the tunnel, cloudflared,
  # caddy-apps, the apps' Authelia. The cert is Cloudflare's, so no expiry condition.
  - name: public
    group: door
    url: https://login.aliammar.net/api/health
    client:
      dns-resolver: udp://1.1.1.1:53
    interval: 60s
    conditions:
      - "[STATUS] == 200"
    alerts: [{ type: discord }]

  - { <<: *service, name: opnsense, url: tcp://10.10.50.1:443 }
  - { <<: *service, name: proxmox-core, url: tcp://10.10.50.11:8006 }
  - { <<: *service, name: proxmox-network, url: tcp://10.10.50.10:8006 }
  - { <<: *service, name: pbs, url: tcp://10.10.20.40:8007 }
  # The nodes' way to PBS, on VLAN 50 (pbs/README.md → Network).
  - { <<: *service, name: pbs-vlan50, url: tcp://10.10.50.24:8007 }
  - { <<: *service, name: omada, url: tcp://10.10.50.25:8043 }
  - { <<: *service, name: unraid, url: tcp://10.10.20.20:80 }
  # P5's stores, by name on `edge`. vlagent runs on the host's network, so Gatus reaches it at the
  # host's address (from its bridge: hosts/docker-admin/default.nix).
  - { <<: *service, name: victoriametrics, url: http://victoriametrics:8428/health, conditions: ["[STATUS] == 200"] }
  - { <<: *service, name: victorialogs, url: http://victorialogs:9428/health, conditions: ["[STATUS] == 200"] }
  - { <<: *service, name: vlagent, url: http://10.10.50.40:9429/health, conditions: ["[STATUS] == 200"] }
  - { <<: *service, name: vmalert, url: http://vmalert:8880/health, conditions: ["[STATUS] == 200"] }
  - { <<: *service, name: vmalert-logs, url: http://vmalert-logs:8880/health, conditions: ["[STATUS] == 200"] }
  - { <<: *service, name: alertmanager, url: http://alertmanager:9093/-/healthy, conditions: ["[STATUS] == 200"] }
  - { <<: *service, name: grafana, url: http://grafana:3000/api/health, conditions: ["[STATUS] == 200"] }
  - { <<: *service, name: mcp-victoriametrics, url: http://mcp-victoriametrics:8080/health/readiness, conditions: ["[STATUS] == 200"] }
  - { <<: *service, name: mcp-victorialogs, url: http://mcp-victorialogs:8081/health/readiness, conditions: ["[STATUS] == 200"] }
  # Wider eyes' exporters (stacks/admin/exporters), by name on `edge`: the landing page, which calls
  # no API (/metrics would).
  - { <<: *service, name: opnsense-exporter, url: http://opnsense-exporter:8080/, conditions: ["[STATUS] == 200"] }
  - { <<: *service, name: omada-exporter, url: http://omada-exporter:9202/healthz, conditions: ["[STATUS] == 200"] }

  - { <<: *app, name: librespeed, url: https://speed.aliammar.net/, conditions: ["[STATUS] == 200"] }
  # /_up is CouchDB's only path without a login.
  - { <<: *app, name: obsidian, url: https://obsidian.aliammar.net/_up, conditions: ["[STATUS] == 200"] }
  - { <<: *app, name: karakeep, url: https://karakeep.aliammar.net/api/health, conditions: ["[STATUS] == 200"] }
  - { <<: *app, name: paperless, url: https://paperless.aliammar.net/accounts/login/, conditions: ["[STATUS] == 200"] }
  - { <<: *forward, name: calibre, url: https://calibre.aliammar.net/ }
  - { <<: *forward, name: sillytavern, url: https://sillytavern.aliammar.net/ }
  - { <<: *forward, name: marinara, url: https://marinara.aliammar.net/ }
  - { <<: *app, name: aiometadata, url: https://aiometadata.aliammar.net/health/live, conditions: ["[STATUS] == 200"] }
  - { <<: *app, name: aiostreams, url: https://aiostreams.aliammar.net/api/v1/health, conditions: ["[STATUS] == 200"] }
  - { <<: *app, name: komga, url: https://komga.aliammar.net/actuator/health, conditions: ["[STATUS] == 200"] }
  # /healthz asks its Postgres too (the container's own check, /livez, doesn't).
  - { <<: *app, name: uchiyomi, url: https://uchiyomi.aliammar.net/healthz, conditions: ["[STATUS] == 200"] }

  # healthchecks.io's read-only badge for each Docker host's heartbeat check (2-state: up, or down
  # once period + grace pass with no ping). No alert: healthchecks.io already posts to #alerts.
  - name: docker-admin heartbeat
    group: job
    url: ${HC_BADGE_URL_ADMIN}
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == up"
  - name: docker-dmz heartbeat
    group: job
    url: ${HC_BADGE_URL_DMZ}
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == up"
  # The same for each Docker host's nightly backup (stacks/<host>/backup): down after a failed run,
  # or once a night passes its 3 h grace without one.
  - name: docker-admin backup
    group: job
    url: ${HC_BADGE_URL_BACKUP_ADMIN}
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == up"
  - name: docker-dmz backup
    group: job
    url: ${HC_BADGE_URL_BACKUP_DMZ}
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == up"
  - name: pbs-offsite
    group: job
    url: ${HC_BADGE_URL_PBS_OFFSITE}
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == up"
  # Discord still takes #alerts' webhook: a GET answers 200 while it exists. No alert here, since a
  # dead webhook can't post. Its result feeds DeliveryWatchdog (stacks/admin/metrics/rules), which
  # healthchecks.io watches. The URL is the secret, so the results show neither it nor errors.
  - name: discord webhook
    group: job
    url: ${DISCORD_ALERTS_WEBHOOK}
    interval: 5m
    conditions:
      - "[STATUS] == 200"
    ui: { hide-url: true, hide-hostname: true, hide-errors: true }

suites:
  - name: technitium-network
    group: dns
    interval: 60s
    endpoints:
      - { <<: *ui, name: technitium-network ui, url: tcp://10.10.70.50:5380 }
      - { <<: *zone, name: technitium-network zone, url: 10.10.70.50 }
      - { <<: *aaaa, name: technitium-network AAAA, url: 10.10.70.50 }
      - { <<: *forwarding, name: technitium-network forwarding, url: 10.10.70.50 }
      - { <<: *blocking, name: technitium-network blocking, url: 10.10.70.50 }
  - name: technitium-core
    group: dns
    interval: 60s
    endpoints:
      - { <<: *ui, name: technitium-core ui, url: tcp://10.10.70.51:5380 }
      - { <<: *zone, name: technitium-core zone, url: 10.10.70.51 }
      - { <<: *aaaa, name: technitium-core AAAA, url: 10.10.70.51 }
      - { <<: *forwarding, name: technitium-core forwarding, url: 10.10.70.51 }
      - { <<: *blocking, name: technitium-core blocking, url: 10.10.70.51 }
