# One row per thing. `service`: each admin UI directly. `door`: caddy-admin + its wildcard cert +
# Authelia, which every admin site shares, so one check covers the door for all of them. `job`: a
# scheduled job's healthchecks.io state (its container is stopped between runs, so Docker can't say).
x-service: &service
  group: service
  interval: 60s
  conditions: ["[CONNECTED] == true"]
  alerts: [{ type: discord }]
x-dns: &dns
  group: dns
  interval: 60s
  dns:
    query-name: auth.aliammar.net
    query-type: A
  conditions:
    - "[DNS_RCODE] == NOERROR"
    - "[BODY] == 10.10.60.60"
  alerts: [{ type: discord }]
# Forwarding works: a public name resolves.
x-dns-forward: &dns-forward
  group: dns
  interval: 60s
  dns:
    query-name: google.com
    query-type: A
  conditions: ["[DNS_RCODE] == NOERROR"]
  alerts: [{ type: discord }]
# Blocking works: googlesyndication.com is on HaGeZi Pro.
x-dns-block: &dns-block
  group: dns
  interval: 60s
  dns:
    query-name: googlesyndication.com
    query-type: A
  conditions: ["[DNS_RCODE] == NXDOMAIN"]
  alerts: [{ type: discord }]

endpoints:
  - name: caddy-admin + authelia
    group: door
    url: https://auth.aliammar.net/api/health
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts: [{ type: discord }]

  - { <<: *service, name: opnsense, url: tcp://10.10.50.1:443 }
  - { <<: *service, name: proxmox-core, url: tcp://10.10.50.11:8006 }
  - { <<: *service, name: proxmox-network, url: tcp://10.10.50.10:8006 }
  - { <<: *service, name: pbs, url: tcp://10.10.20.40:8007 }
  - { <<: *service, name: omada, url: tcp://10.10.50.25:8043 }
  - { <<: *service, name: technitium-core, url: tcp://10.10.70.51:5380 }
  - { <<: *service, name: technitium-network, url: tcp://10.10.70.50:5380 }
  - { <<: *service, name: unraid, url: tcp://10.10.20.20:80 }

  - { <<: *dns, name: technitium-network, url: 10.10.70.50 }
  - { <<: *dns-forward, name: technitium-network forwarding, url: 10.10.70.50 }
  - { <<: *dns-block, name: technitium-network blocking, url: 10.10.70.50 }
  - { <<: *dns, name: technitium-core, url: 10.10.70.51 }
  - { <<: *dns-forward, name: technitium-core forwarding, url: 10.10.70.51 }
  - { <<: *dns-block, name: technitium-core blocking, url: 10.10.70.51 }

  # healthchecks.io's read-only badge for check `docker-admin` (2-state: up, or down once period +
  # grace pass with no ping). No alert: healthchecks.io already posts to #alerts.
  - name: heartbeat
    group: job
    url: ${HC_BADGE_URL}
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == up"
