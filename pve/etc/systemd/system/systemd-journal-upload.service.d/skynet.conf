# Debian's unit retries within a second, so a few seconds without docker-admin's vlagent hit
# systemd's start limit and stop the upload for good. Retry from 3 s, backing off to a minute (the
# unit's own RestartSteps), and never give up. As PBS's.
[Unit]
StartLimitIntervalSec=0

[Service]
RestartSec=3s
