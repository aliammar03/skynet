# Debian's node-exporter, for docker-admin's VictoriaMetrics (skynetv2.md → P5 → Wider eyes), with
# the systemd collector added, so a failed unit alerts, and the textfile folder where
# prometheus-node-exporter-collectors' timers write SMART and NVMe health. Debian's ARGS file stays
# as shipped.
[Service]
ExecStart=
ExecStart=/usr/bin/prometheus-node-exporter --collector.systemd --collector.systemd.unit-include=.+[.](service|socket|timer) --collector.textfile.directory=/var/lib/prometheus/node-exporter
