[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "skynet"
version = "0.1.0"
description = "Skynet operations engine"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
skynet = "skynet.cli:main"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/skynet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -p no:cacheprovider"
# Delete every tmp_path after the session: the gate fixtures copy inventory per test, and kept
# runs fill the ops VM's RAM-backed /tmp.
tmp_path_retention_policy = "none"
