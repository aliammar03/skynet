[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "skynet"
version = "0.1.0"
description = "Skynet operations engine"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
skynet = "skynet.cli:main"

[tool.pytest.ini_options]
# Collect only the behavioral suite. A bare `pytest` from the repo root (pre-commit hook, CI)
# must never wander into a stray gitignored `result/` nix-build symlink and import its stdlib tests.
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/skynet"]
