name: nix

# Every PR that touches the flake builds the ops-VM system closure. Python source-only checks stay
# in checks.yml, so a package edit does not force an unrelated host build. Unlike checks.yml's
# shell gates, this workflow fetches nixpkgs and builds a closure.
on:
  pull_request:
    paths: [flake.nix, flake.lock, "hosts/**", "nix/modules/**", "nix/home/**", .github/workflows/nix.yml]
  push:
    branches: [main]
    paths: [flake.nix, flake.lock, "hosts/**", "nix/modules/**", "nix/home/**"]

jobs:
  build:
    name: nix build (${{ matrix.host }} toplevel)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        host: [vm-skynet-ops]
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # This workflow resolves locked inputs and builds the declared system closure.
      - name: build the ${{ matrix.host }} system closure
        run: nix build .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel --print-build-logs
