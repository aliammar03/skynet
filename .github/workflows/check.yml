name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      # Evaluate every host and output; building happens on the host (comin keeps the current
      # generation if a build fails), so a full build here would only cost time.
      - run: nix flake check --no-build
