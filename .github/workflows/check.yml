name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The layout's contracts: every stack's files, README labels and compose contract, every
      # host's README, every *.sops.* file encrypted, every repo path a file names
      # (.github/check-layout.sh).
      - run: .github/check-layout.sh
      # Relative links between files resolve; nothing remote is fetched.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --offline --no-progress './**/*.md'
          jobSummary: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      # Our own scripts, with the flake's nixpkgs: every shell script through shellcheck (the ones
      # in packages/ have no shebang: writeShellApplication runs them as bash) and every Python
      # file through ruff's syntax and undefined-name rules. SC1091: a file sourced at run time
      # isn't there to follow. The scripts written inside Nix files are checked when their host
      # builds.
      - run: |
          git ls-files -z 'packages/*.sh' | xargs -0 nix run --inputs-from . nixpkgs#shellcheck -- --shell=bash
          git ls-files -z '*.sh' ':!packages' | xargs -0 nix run --inputs-from . nixpkgs#shellcheck -- --exclude=SC1091
          git ls-files -z '*.py' | xargs -0 nix run --inputs-from . nixpkgs#ruff -- check --no-cache --isolated --select E9,F63,F7,F82
      # Every long-running service shows its health, the image's own read from its registry
      # (.github/check-health.sh).
      - run: nix shell --inputs-from . nixpkgs#skopeo -c .github/check-health.sh
      # Every output evaluates; the job `build` builds the hosts.
      - run: nix flake check --no-build
      # The observability configs, each checked by the image that runs it (taken from its
      # compose.yaml, so a Renovate bump checks with the new version): the scrape targets (unknown
      # fields fail too), both vmalerts' rules, and Alertmanager's config.
      - run: |
          img() { yq ".services.\"$2\".image" "stacks/admin/$1/compose.yaml"; }
          docker run --rm -v "$PWD/stacks/admin/metrics/scrape.yaml:/scrape.yaml:ro" "$(img metrics victoriametrics)" \
            -dryRun -promscrape.config=/scrape.yaml
          docker run --rm -v "$PWD/stacks/admin/metrics/rules:/rules:ro" "$(img metrics vmalert)" \
            -dryRun -rule='/rules/*.yml'
          # The rules' unit tests, with vmalert-tool at vmalert's own version.
          tool=$(img metrics vmalert | sed -E 's#/vmalert:([^@]+)@.*#/vmalert-tool:\1#')
          docker run --rm -v "$PWD/stacks/admin/metrics:/m:ro" -w /m "$tool" unittest --files=rules.test.yml
          docker run --rm -v "$PWD/stacks/admin/logs/rules:/rules:ro" "$(img logs vmalert-logs)" \
            -dryRun -rule.defaultRuleType=vlogs -rule='/rules/*.yml'
          docker run --rm --entrypoint /bin/amtool -v "$PWD/stacks/admin/alertmanager/alertmanager.yml:/am.yml:ro" \
            "$(img alertmanager alertmanager)" check-config /am.yml
          # Grafana's boards parse (Grafana skips one that doesn't, with only a log line).
          for f in stacks/admin/grafana/dashboards/*/*.json; do jq -e . "$f" >/dev/null || { echo "bad JSON: $f"; exit 1; }; done

  # Every host built, as comin builds it on the host, so a host change merges only once it builds
  # (docs/plans/autonomy.md → Merges, tier B). The lab's cache is out of reach (ADR-0003), so this
  # takes cache.nixos.org's and builds what it lacks: our own scripts and configs, and claude-code.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      # One build for all of them, so what they share is fetched once. The disk left is printed
      # because the runner's is small (about 14 GB free).
      - run: |
          hosts=$(nix eval --json .#nixosConfigurations --apply builtins.attrNames | jq -r '.[]')
          nix build --no-link --print-build-logs \
            $(printf '.#nixosConfigurations.%s.config.system.build.toplevel ' $hosts)
          df -h /
