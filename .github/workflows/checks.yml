name: checks

# Deterministic, non-LLM gates that must hold on every PR — the CI half of the pre-commit hook
# (.githooks/pre-commit). CI re-runs them even if a commit used --no-verify or never set
# core.hooksPath. Read-only: no secrets, no network, no writes to the repo.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  invariants:
    name: invariants (hard laws)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Hard laws in invariants.json hold against observed inventory and the tracked tree: excluded
      # guests stay unpooled, the managed-pool dial matches, and plaintext secret patterns fail.
      - name: check-invariants
        run: ./scripts/check-invariants.sh

  entity-derivation:
    name: entity derivation (L0 identity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Unit-test VMID/IP derivation and entity-ID grammar against the known-good set. This is local,
      # deterministic, and independent of credentials or network access.
      - name: entity-test
        run: bash tests/entity-test.sh
      # The cold-boot digest includes explicit open threads and suppresses resolved history.
      - name: digest-test
        run: bash tests/digest-test.sh
      - name: dns-revert-test
        run: bash tests/dns-revert-test.sh
      - name: compose-rollback-test
        run: bash tests/compose-rollback-test.sh
      - name: cert-selector-test
        run: bash tests/cert-selector-test.sh
      - name: tofu-rollback-test
        run: bash tests/tofu-rollback-test.sh
      - name: pve-snapshot-test
        run: bash tests/pve-snapshot-test.sh
      - name: provisioning-truth-test
        run: bash tests/provisioning-truth-test.sh
      # The six native worker role TOMLs parse and carry their full contract; their sandboxes match
      # invariants.json; no worker gets production authority via danger-full-access; no legacy role or
      # concurrency cap survives.
      - name: construction-test
        run: bash tests/construction-test.sh
      - name: gitignore-test
        run: bash tests/gitignore-test.sh
      - name: nightly-automerge-test
        run: bash tests/nightly-automerge-test.sh
      - name: nightly-sequence-test
        run: bash tests/nightly-sequence-test.sh
      # Documentation/style/context checks are manual during the repository overhaul.
      # Restore their maintained replacements before completing the overhaul.

  python:
    name: Python package (Nix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: behavioral tests
        run: nix develop --no-write-lock-file -c pytest -q
      - name: lint
        run: nix develop --no-write-lock-file -c ruff check src tests/test_*.py
      - name: type check
        run: nix develop --no-write-lock-file -c mypy src/skynet
      - name: packaged checks
        run: nix build --no-write-lock-file --no-link .#checks.x86_64-linux.skynet
