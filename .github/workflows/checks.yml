name: checks

# Deterministic, non-LLM gates that must hold on every PR — the CI half of the pre-commit hook
# (.githooks/pre-commit). CI re-runs them even if a commit used --no-verify or never set
# core.hooksPath. Read-only: no secrets, no network, no writes to the repo.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  invariants:
    name: invariants (hard laws)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # SKY-011: the machine-checkable hard laws in invariants.json hold against observed inventory
      # + the tracked tree — excluded guests never pooled, the ops-managed pool set matches the
      # declared dial, no plaintext secret patterns. A non-LLM gate (ADR 0003); fails the PR on any
      # violation. Also runs in the pre-commit hook.
      - name: check-invariants
        run: ./scripts/check-invariants.sh

  entity-derivation:
    name: entity derivation (L0 identity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # SKY-018 P1: the VMID->IP derivation and entity-ID grammar (scripts/entity.sh) have a checker,
      # not just a writer. Unit-tests the convention against the known-good set. Deterministic, no
      # network/secrets. (The `bin/ops entities` audit's running-unmapped exit is a report signal, not
      # a PR gate yet — P2 promotes the "every running entity is mapped or excepted" law into
      # check-invariants.sh once the stale/undeclared holes are triaged.)
      - name: entity-test
        run: bash tests/entity-test.sh
      # SKY-018 review: the cold-boot digest must not resurface open threads about DESTROYED guests
      # (the append-only journal + verbatim-copy nightly created a feedback loop). render-digest.sh
      # suppresses them; this asserts it stays suppressed.
      - name: digest-test
        run: bash tests/digest-test.sh
      - name: dns-revert-test
        run: bash tests/dns-revert-test.sh
      - name: compose-rollback-test
        run: bash tests/compose-rollback-test.sh
      - name: tofu-rollback-test
        run: bash tests/tofu-rollback-test.sh
      - name: collect-pbs-test
        run: bash tests/collect-pbs-test.sh
      # SKY-022 P2: the construction doctrine's [testable] claims are machine-checked, not just prose
      # — the ≤2-helper cap and each helper's declared .codex/ sandbox match invariants.json, and no
      # helper may declare danger-full-access (construction never gains production authority).
      - name: construction-test
        run: bash tests/construction-test.sh
      - name: gitignore-test
        run: bash tests/gitignore-test.sh
