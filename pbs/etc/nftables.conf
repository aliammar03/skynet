#!/usr/sbin/nft -f
# PBS's own firewall, for VLAN 50 only: there OPNsense isn't between PBS and its neighbours. `lan`
# (VLAN 20) stays OPNsense's to filter. Only this table: declared, deleted and written again, so a
# reload replaces it and touches nothing else.
table inet mgmt50
delete table inet mgmt50

table inet mgmt50 {
	chain input {
		type filter hook input priority filter; policy accept;
		iifname != "mgmt50" accept
		ct state established,related accept
		# The nodes' backups and restores; docker-admin's Gatus checks the same port.
		ip saddr { 10.10.50.10, 10.10.50.11, 10.10.50.40 } tcp dport 8007 accept
		ip saddr { 10.10.50.10, 10.10.50.11, 10.10.50.40 } icmp type echo-request accept
		counter drop
	}
}
