# Debian's node-exporter, for docker-admin's VictoriaMetrics (skynetv2.md → P5 → Metrics), with the
# systemd collector added, so a failed unit alerts. Debian's ARGS file stays as shipped.
[Service]
ExecStart=
ExecStart=/usr/bin/prometheus-node-exporter --collector.systemd --collector.systemd.unit-include=.+[.](service|socket|timer)
