# doco-cd on docker-admin (poll target `admin`): every folder in stacks/admin/ with a compose.yaml is
# a stack. A folder removed from git is removed from the host; volumes are kept.
working_dir: stacks/admin
auto_discovery:
  enabled: true
  depth: 1
  delete: true
  remove_volumes: false
reconciliation:
  enabled: true
  events: [unhealthy, die, oom]
timeout: 300
