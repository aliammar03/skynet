# Throwaway recursive resolver for `dnsbench.py recursion`: README replaces @DIR@ with a temp folder.
server:
  interface: 127.0.0.1
  port: 5353
  do-ip6: no
  username: ""
  chroot: ""
  directory: "@DIR@"
  pidfile: ""
  logfile: ""
  use-syslog: no
  do-daemonize: no
  num-threads: 1
  qname-minimisation: yes
  prefetch: yes
  serve-expired: yes
  aggressive-nsec: yes
  auto-trust-anchor-file: "@DIR@/root.key"
  access-control: 127.0.0.0/8 allow
remote-control:
  control-enable: no
